<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ORT-TECH — ניהול לקוחות ותהליכים</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700;800;900&family=Rubik:wght@500;700;800;900&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#eef0f4;--bg-2:#f5f7fb;--card:#ffffff;--card-2:#f5f7fb;--line:#e4e7ee;
    --txt:#0f1322;--muted:#6b7183;--accent:#2b5cff;--accent-2:#0fb981;--amber:#f5a623;
    --green:#0fb981;--red:#ef4444;--blue:#2b5cff;--purple:#a855f7;--coral:#ff6a5d;--primary-ink:#1741d6;
    --shadow-sm:0 2px 10px rgba(15,19,34,.06);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Heebo',system-ui,sans-serif;background:var(--bg);color:var(--txt);line-height:1.5;padding-bottom:40px}
  a{color:inherit;text-decoration:none}
  button{font-family:inherit;cursor:pointer}
  /* ---- topbar / nav ---- */
  .topbar{position:sticky;top:0;z-index:30;background:rgba(255,255,255,.82);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
  .topbar-in{display:flex;align-items:center;justify-content:space-between;padding:11px 18px;max-width:1180px;margin:0 auto}
  .brand{font-weight:900;font-size:1.08rem;display:flex;align-items:center;gap:9px}
  .brand .logo-img{height:28px;width:auto}
  .brand .mark{width:30px;height:30px;border-radius:9px;background:linear-gradient(135deg,var(--accent),var(--accent-2));display:grid;place-items:center;font-size:1rem;color:#fff}
  .brand span{color:var(--accent-2)}
  .nav{display:flex;gap:4px;overflow-x:auto;padding:0 14px 9px;max-width:1180px;margin:0 auto;scrollbar-width:none}
  .nav::-webkit-scrollbar{display:none}
  .nav button{flex:0 0 auto;padding:7px 15px;border-radius:999px;font-size:.87rem;font-weight:700;color:var(--muted);border:1px solid transparent;white-space:nowrap;background:none}
  .nav button.on{background:var(--card);color:var(--txt);border-color:var(--line)}
  .nav button:hover{color:var(--txt)}
  /* ---- layout ---- */
  .wrap{max-width:1180px;margin:0 auto;padding:18px}
  h2{font-size:1.32rem;font-weight:900;margin-bottom:3px}
  .sub{color:var(--muted);font-size:.87rem;margin-bottom:16px}
  .row{display:flex;gap:9px;align-items:center;flex-wrap:wrap}
  .grow{flex:1}
  .spread{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
  /* ---- buttons ---- */
  .btn{background:var(--card);border:1.5px solid var(--line);color:var(--txt);font-weight:700;padding:8px 16px;border-radius:999px;font-size:.88rem}
  .btn:hover{border-color:var(--accent)}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
  .btn.primary:hover{background:var(--primary-ink)}
  .btn.teal{background:var(--accent-2);border-color:var(--accent-2);color:#04201c}
  .btn.small{padding:5px 12px;font-size:.8rem}
  .btn.ghost{background:transparent}
  .btn.danger{color:var(--red);border-color:transparent}
  .btn.danger:hover{border-color:var(--red)}
  /* ---- inputs ---- */
  input,select,textarea{background:var(--bg-2);border:1px solid var(--line);color:var(--txt);border-radius:10px;padding:9px 12px;font-family:inherit;font-size:.92rem;width:100%}
  input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent)}
  input::placeholder,textarea::placeholder{color:#5e6c96}
  .search{max-width:280px}
  /* ---- kpis ---- */
  .kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(155px,1fr));gap:11px;margin:6px 0 18px}
  .kpi{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:14px 16px}
  .kpi b{font-size:1.5rem;font-weight:900;display:block;line-height:1.2}
  .kpi small{color:var(--muted);font-size:.78rem}
  .kpi.accent b{color:var(--accent-2)}
  .kpi.amber b{color:var(--amber)}
  .kpi.green b{color:var(--green)}
  /* ---- cards ---- */
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
  @media(max-width:860px){.grid2,.grid3{grid-template-columns:1fr}}
  .card{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:15px 17px;margin-bottom:13px}
  .card h3{font-size:1.02rem;font-weight:800;margin-bottom:11px}
  .list-item{display:flex;justify-content:space-between;align-items:center;gap:11px;padding:12px 0;border-bottom:1px solid var(--line);cursor:pointer}
  .list-item:last-child{border-bottom:0}
  .li-main{min-width:0}
  .li-main b{display:block;font-size:.96rem}
  .li-main small{color:var(--muted);font-size:.8rem}
  .li-val{text-align:left;white-space:nowrap;font-weight:800}
  /* ---- pills ---- */
  .pill{padding:2px 11px;border-radius:999px;font-size:.74rem;font-weight:700;border:1px solid;white-space:nowrap;display:inline-block}
  .chips{display:flex;flex-wrap:wrap;gap:5px}
  .chip{padding:2px 9px;border-radius:999px;font-size:.72rem;font-weight:600;background:rgba(245,158,11,.13);color:#f5c073;border:1px solid rgba(245,158,11,.32);white-space:nowrap}
  .p-blue{background:rgba(59,130,246,.14);color:#1741d6;border-color:rgba(59,130,246,.4)}
  .p-green{background:rgba(34,197,94,.14);color:#0a7f5a;border-color:rgba(34,197,94,.4)}
  .p-amber{background:rgba(246,183,60,.14);color:#9a6a00;border-color:rgba(246,183,60,.4)}
  .p-red{background:rgba(239,68,68,.14);color:#b42323;border-color:rgba(239,68,68,.4)}
  .p-purple{background:rgba(168,85,247,.14);color:#7a2fb0;border-color:rgba(168,85,247,.4)}
  .p-gray{background:rgba(147,160,200,.12);color:var(--muted);border-color:var(--line)}
  .p-teal{background:rgba(0,209,178,.14);color:#0a7f6b;border-color:rgba(0,209,178,.4)}
  .empty{color:var(--muted);text-align:center;padding:34px 10px;font-size:.9rem}
  .muted{color:var(--muted)}
  .tag{display:inline-block;background:var(--bg-2);border:1px solid var(--line);border-radius:6px;padding:1px 8px;font-size:.74rem;color:var(--muted);margin-inline-end:4px}
  /* ---- progress ---- */
  .bar{height:7px;background:var(--bg-2);border-radius:999px;overflow:hidden;margin-top:6px}
  .bar>span{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent-2))}
  /* ---- table ---- */
  table{width:100%;border-collapse:collapse;font-size:.88rem}
  th,td{text-align:right;padding:9px 8px;border-bottom:1px solid var(--line)}
  th{color:var(--muted);font-weight:700;font-size:.78rem}
  td.num,th.num{text-align:left;font-variant-numeric:tabular-nums}
  .tbl-wrap{overflow-x:auto}
  tr.hot td{background:rgba(43,92,255,.08)}
  /* ---- modal ---- */
  /* מעל בועת הרעיונות הצפה (z≈2147483000) — מודאל הוא אינטראקציה ממוקדת, דבר לא אמור לצוף מעליו (חשוב במיוחד במובייל bottom-sheet) */
  .overlay{position:fixed;inset:0;background:rgba(0,0,0,.66);z-index:2147483600;display:flex;align-items:flex-end;justify-content:center}
  @media(min-width:640px){.overlay{align-items:center}}
  .modal{background:var(--bg-2);border:1px solid var(--line);border-radius:18px 18px 0 0;width:100%;max-width:600px;max-height:93vh;overflow-y:auto;padding:20px}
  @media(min-width:640px){.modal{border-radius:18px}}
  .modal.wide{max-width:820px}
  .modal h3{font-size:1.15rem;font-weight:900;margin-bottom:15px}
  .f{margin-bottom:12px}
  .f label{display:block;font-size:.8rem;color:var(--muted);font-weight:700;margin-bottom:4px}
  .f2{display:grid;grid-template-columns:1fr 1fr;gap:11px}
  .f3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:11px}
  @media(max-width:560px){.f2,.f3{grid-template-columns:1fr}}
  .modal-actions{display:flex;gap:9px;justify-content:flex-start;margin-top:18px;flex-wrap:wrap}
  /* ---- login ---- */
  #login{position:fixed;inset:0;z-index:100;background:radial-gradient(900px 500px at 80% -10%,rgba(43,92,255,.25),transparent 60%),var(--bg);display:flex;align-items:center;justify-content:center;padding:20px}
  .login-card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:30px 26px;max-width:380px;width:100%;text-align:center}
  .login-card .logo-img{width:200px;max-width:80%;margin:0 auto 14px;display:block}
  .login-card h1{font-size:1.4rem;font-weight:900;margin-bottom:4px}
  .login-card p{color:var(--muted);font-size:.88rem;margin-bottom:20px}
  .login-card input{text-align:center;letter-spacing:.3em;font-size:1.1rem;margin-bottom:12px}
  .err{color:var(--red);font-size:.82rem;min-height:18px;margin-bottom:6px}
  /* ---- toast ---- */
  #toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);z-index:120;display:flex;flex-direction:column;gap:8px;align-items:center}
  .toast{background:var(--card-2);border:1px solid var(--line);border-radius:11px;padding:10px 18px;font-size:.88rem;font-weight:700;box-shadow:0 10px 30px rgba(0,0,0,.4)}
  .toast.ok{border-color:var(--green)}.toast.bad{border-color:var(--red)}
  .split{display:grid;grid-template-columns:1fr 1fr;gap:6px}
  .stat-row{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px dashed var(--line);font-size:.9rem}
  .stat-row:last-child{border-bottom:0}
  .stat-row b{font-variant-numeric:tabular-nums}
  .big{font-size:1.9rem;font-weight:900;line-height:1.1}
  .hint{font-size:.78rem;color:var(--muted);margin-top:3px}
  .pstep{padding:8px;border:1px solid var(--line);border-radius:10px;margin-bottom:8px;background:var(--bg-2)}
  .pstep input::placeholder{font-size:.82rem}
  .seg{display:flex;gap:4px;background:var(--bg-2);border:1px solid var(--line);border-radius:11px;padding:4px;flex-wrap:wrap}
  .seg button{flex:1;min-width:70px;border:0;background:none;color:var(--muted);font-weight:700;padding:7px 8px;border-radius:8px;font-size:.83rem}
  .seg button.on{background:var(--accent);color:#fff}
  /* ---- מתודולוגיה (פלייבוק) ---- */
  .pb-list{margin:6px 0 0;padding-inline-start:20px}
  .pb-list li{margin-bottom:6px;font-size:.9rem}
  .pb-doc{white-space:pre-wrap;word-break:break-word;background:var(--bg-2);border:1px solid var(--line);border-radius:12px;padding:14px;font-size:.84rem;line-height:1.6;max-height:54vh;overflow:auto;font-family:inherit}
  .pb-sec{border:1px solid var(--line);border-radius:12px;padding:10px;margin-bottom:10px;background:var(--bg-2)}
  .pb-check{display:flex;gap:10px;align-items:flex-start;padding:11px 4px;border-bottom:1px solid var(--line);cursor:pointer}
  .pb-check:last-child{border-bottom:0}
  .pb-check input{width:20px;height:20px;margin-top:1px;flex:none;accent-color:var(--accent)}
  .pb-check span{display:flex;flex-direction:column;gap:2px;min-width:0}
  .pb-check.on b{opacity:.55;text-decoration:line-through}
  .pb-check .hint{margin-top:0}
  .pb-item{border-bottom:1px solid var(--line);padding-bottom:9px}
  .pb-item:last-child{border-bottom:0;padding-bottom:0}
  .pb-item .pb-check{border-bottom:0;padding-bottom:4px}
  /* בטופס השאלה נשארת קריאה גם אחרי מענה — הסימון עובר לתיבה ולתשובה */
  .pb-item .pb-check.on b{opacity:1;text-decoration:none}
  .pb-head{display:flex;align-items:flex-start;gap:8px}
  .pb-head .pb-check{flex:1;min-width:0}
  .pb-na{flex:none;margin-top:9px;font-size:.72rem;font-weight:700;color:var(--muted);
    background:var(--bg-2);border:1px solid var(--line);border-radius:999px;padding:3px 10px;
    cursor:pointer;white-space:nowrap;transition:.15s}
  .pb-na:hover{border-color:var(--accent);color:var(--accent)}
  .pb-na.on{background:var(--muted);color:#fff;border-color:var(--muted)}
  .pb-item.na{opacity:.62}
  .pb-item.na .pb-check b{text-decoration:line-through}
  .na-note{font-size:.8rem;color:var(--muted);font-style:italic;padding:2px 2px 6px}
  .pb-answer{width:100%;margin:0 0 4px;padding:9px 11px;font-size:.88rem;line-height:1.55;
    background:var(--bg-2);border:1px solid var(--line);border-radius:10px;color:var(--txt);resize:vertical}
  .pb-answer:focus{outline:none;border-color:var(--accent)}
  .pb-item.on .pb-answer{border-color:rgba(0,209,178,.35)}
  .run-row{display:flex;gap:10px;align-items:center;padding:9px 0;border-bottom:1px dashed var(--line);cursor:pointer}
  .run-row:last-child{border-bottom:0}
  .run-row .grow{min-width:0}
  .run-row b{display:block;font-size:.9rem}
  /* ===== ליטוש ממשק — make-interfaces-feel-better (ECC) ===== */
  html{-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
  /* טקסט: איזון כותרות, ריכוך תיאורים, מספרים מיושרים */
  h2,.card h3,.modal h3,.login-card h1{text-wrap:balance}
  .sub,.hint,.li-main small,.kpi small,.empty{text-wrap:pretty}
  .kpi b,.li-val,.big{font-variant-numeric:tabular-nums}
  /* צללים עדינים לעומק כרטיסים */
  .kpi,.card{box-shadow:var(--shadow-sm)}
  /* תנועה: מאפיינים מפורשים בלבד, לחיצה טקטילית ואזורי-מגע נוחים */
  .btn{transition-property:transform,background-color,border-color,color,box-shadow;transition-duration:140ms;transition-timing-function:ease-out;min-height:40px;display:inline-flex;align-items:center;justify-content:center;gap:6px}
  .btn.small{min-height:34px}
  .btn:active{transform:scale(.96)}
  .nav button{min-height:36px}
  .nav button,.seg button{transition:color .14s ease-out,background-color .14s ease-out,border-color .14s ease-out}
  .nav button:active,.seg button:active{transform:scale(.97)}
  input,select,textarea{transition:border-color .14s ease-out,box-shadow .14s ease-out}
  input:focus,select:focus,textarea:focus{box-shadow:0 0 0 3px rgba(43,92,255,.22)}
  .list-item,.run-row,.pb-check{transition:background-color .14s ease-out}
  .list-item:hover,.run-row:hover,.pb-check:hover{background:rgba(43,92,255,.06)}
  /* מצבי-פוקוס נראים למקלדת */
  button:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  /* קו-מתאר עדין לתמונות כדי שלא יטשטשו לרקע */
  img{outline:1px solid rgba(255,255,255,.1);outline-offset:-1px}
  /* כיבוד העדפת הפחתת-תנועה */
  @media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important;scroll-behavior:auto!important}}
  /* ===== מאגר סקילז (ECC) ===== */
  .sk-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(235px,1fr));gap:9px;margin-top:8px}
  .sk-item{background:var(--bg-2);border:1px solid var(--line);border-radius:12px;padding:10px 12px;cursor:pointer;position:relative;transition:border-color .14s ease-out,transform .06s}
  .sk-item:hover{border-color:var(--accent)}
  .sk-item:active{transform:scale(.99)}
  .sk-item.star{border-color:rgba(246,183,60,.5)}
  .sk-item.inst{border-color:rgba(34,197,94,.5);background:linear-gradient(0deg,rgba(34,197,94,.06),transparent 60%)}
  .sk-inst{margin-top:7px;display:inline-flex;align-items:center;gap:5px;font-size:.72rem;font-weight:700;color:#0a7f5a;background:rgba(34,197,94,.13);border:1px solid rgba(34,197,94,.35);border-radius:7px;padding:2px 8px}
  .sk-name{font-weight:800;font-size:.84rem;direction:ltr;text-align:right;color:var(--accent-2);word-break:break-word}
  .sk-item.cmd .sk-name{color:var(--amber)}
  .sk-desc{color:var(--muted);font-size:.79rem;margin-top:3px;line-height:1.45}
  .sk-rel{margin-top:6px;display:flex;flex-wrap:wrap;gap:4px}
  .sk-rel .t{font-size:.65rem;direction:ltr;background:var(--card-2);border:1px solid var(--line);border-radius:5px;padding:1px 5px;color:var(--muted)}
  .sk-star-tag{position:absolute;top:8px;left:10px;font-size:.72rem}
  .sk-cat-count{color:var(--muted);font-weight:700;font-size:.76rem;margin-inline-start:4px}
  .sk-sec{padding-bottom:14px}
  /* בחירה מרובה */
  .sk-item{padding-inline-start:32px}
  .sk-cb{position:absolute;inset-inline-start:10px;top:12px;width:18px;height:18px;border:2px solid var(--line);border-radius:5px;display:grid;place-items:center;color:#fff;font-size:.72rem;line-height:1;transition:background-color .12s ease-out,border-color .12s ease-out}
  .sk-item.sel{border-color:var(--accent);background:linear-gradient(0deg,rgba(43,92,255,.12),transparent 62%)}
  .sk-item.sel .sk-cb{background:var(--accent);border-color:var(--accent)}
  .sk-item.sel .sk-cb::before{content:'✓'}
  /* מגירת בחירה */
  .sk-tray{position:fixed;inset-inline:0;bottom:0;z-index:60;transform:translateY(115%);transition:transform .22s ease;background:var(--card-2);border-top:1px solid var(--line);box-shadow:0 -10px 30px rgba(0,0,0,.4);backdrop-filter:blur(8px)}
  .sk-tray.open{transform:translateY(0)}
  .sk-tray-in{max-width:1180px;margin:0 auto;padding:11px 18px;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
  .sk-tray-chips{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px;max-height:118px;overflow-y:auto}
  .sk-tray-grp{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
  .sk-tray-lbl{font-size:.75rem;color:var(--muted);font-weight:700;margin-inline-end:4px}
  .sk-chip{font-family:inherit;font-size:.76rem;background:var(--bg-2);border:1px solid var(--line);border-radius:7px;padding:3px 8px;cursor:pointer;color:var(--txt);white-space:nowrap}
  .sk-chip:hover{border-color:var(--red);color:var(--red)}
  .sk-tray-act{display:flex;gap:8px;align-items:center;flex:none}
  /* ===== לוח בקרה — היררכיה ויזואלית ===== */
  .rev{display:grid;grid-template-columns:1.25fr 1fr;gap:16px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px 20px;margin:8px 0 12px;box-shadow:var(--shadow-sm)}
  @media(max-width:640px){.rev{grid-template-columns:1fr}}
  .rev-hero{border-inline-end:1px solid var(--line);padding-inline-end:18px}
  @media(max-width:640px){.rev-hero{border-inline-end:0;border-bottom:1px solid var(--line);padding-inline-end:0;padding-bottom:14px}}
  .rev-hero .lbl{color:var(--muted);font-size:.82rem;font-weight:700}
  .rev-hero .val{font-size:2.6rem;font-weight:900;line-height:1.04;color:var(--accent-2);font-variant-numeric:tabular-nums;margin:2px 0 3px}
  .rev-hero .note{color:var(--muted);font-size:.82rem}
  .rev-side{display:grid;grid-template-columns:1fr 1fr;gap:12px;align-content:center}
  @media(max-width:400px){.rev-side{grid-template-columns:1fr}}
  .rev-stat .n{font-size:1.45rem;font-weight:900;font-variant-numeric:tabular-nums;line-height:1.1;display:block;color:var(--amber)}
  .rev-stat .l{color:var(--muted);font-size:.77rem}
  .att{display:flex;flex-wrap:wrap;gap:9px;margin-bottom:16px}
  .att-item{display:flex;align-items:center;gap:10px;background:var(--bg-2);border:1px solid var(--line);border-radius:12px;padding:10px 13px;cursor:pointer;transition:border-color .14s ease-out,transform .06s;flex:1 1 155px}
  .att-item:hover{border-color:var(--accent)}
  .att-item:active{transform:scale(.99)}
  .att-ico{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;font-size:1.05rem;flex:none}
  .att-txt{display:flex;flex-direction:column;line-height:1.15;min-width:0}
  .att-txt .n{font-size:1.3rem;font-weight:900;font-variant-numeric:tabular-nums}
  .att-txt .l{color:var(--muted);font-size:.76rem}
  .att-item.red .att-ico{background:rgba(239,68,68,.14);border:1px solid rgba(239,68,68,.42);color:#b42323}
  .att-item.blue .att-ico{background:rgba(59,130,246,.14);border:1px solid rgba(59,130,246,.42);color:#1741d6}

<!-- מסך כניסה -->
<div id="login">

  </div>
</div>

<!-- אפליקציה -->
<div id="app" style="display:none">
  <div class="topbar">

      <div class="brand"><img src="/ort-tech-logo.png" alt="ORT-TECH" class="logo-img">HQ</div>
      <div class="row" style="gap:6px"><button class="btn small ghost" onclick="go('skills')" title="מאגר הסקילז והפקודות">🧩 סקילז</button><button class="btn small ghost" onclick="changePinForm()">🔒 קוד</button><button class="btn small ghost" onclick="logout()">יציאה</button></div>
    </div>
    <div class="nav" id="nav"></div>
  </div>
  <div class="wrap" id="view"></div>
</div>

<div id="toast"></div>

<script>
// ============ תשתית ============
const TOKEN_KEY = 'agencyhq_token';
let TOKEN = localStorage.getItem(TOKEN_KEY) || '';
let CURRENT = 'today';
const $ = (id) => document.getElementById(id);

const money = (n) => new Intl.NumberFormat('he-IL',{style:'currency',currency:'ILS',maximumFractionDigits:0}).format(Math.round(n||0));
const money1 = (n) => new Intl.NumberFormat('he-IL',{maximumFractionDigits:0}).format(Math.round(n||0));
const esc = (s) => String(s??'').replace(/[&<>"']/g,(m)=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const j = (o) => esc(JSON.stringify(o)); // JSON בטוח ל-attribute עם גרשיים בעברית
const waLink = (phone) => { let p=String(phone||'').replace(/\D/g,''); if(p.startsWith('0')) p='972'+p.slice(1); return 'https://wa.me/'+p; };
const todayISO = () => new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Jerusalem'}).format(new Date());

async function api(path, opts={}){
  const res = await fetch('/api'+path, {
    ...opts,
    headers:{'Content-Type':'application/json','x-admin-token':TOKEN, ...(opts.headers||{})},
  });
  if(res.status===401){ TOKEN=''; localStorage.removeItem(TOKEN_KEY); showLogin(); throw new Error('unauthorized'); }
  const data = await res.json().catch(()=>({}));
  if(!res.ok) throw new Error(data.error||('http_'+res.status));
  return data;
}
const apiGet = (p)=>api(p);
const apiPost = (p,b)=>api(p,{method:'POST',body:JSON.stringify(b||{})});
const apiPatch = (p,b)=>api(p,{method:'PATCH',body:JSON.stringify(b||{})});
const apiPut = (p,b)=>api(p,{method:'PUT',body:JSON.stringify(b||{})});
const apiDel = (p)=>api(p,{method:'DELETE'});

function toast(msg, kind='ok'){
  const el = document.createElement('div');
  el.className='toast '+kind; el.textContent=msg;
  $('toast').appendChild(el);
  setTimeout(()=>{el.style.opacity='0';el.style.transition='.3s';setTimeout(()=>el.remove(),300);},2200);
}

// ============ כניסה ============
async function boot(){
  if(TOKEN){
    try{ await apiGet('/dashboard'); showApp(); return; }catch(e){ /* ננסה מסך כניסה */ }
  }
  showLogin();
}
async function showLogin(){
  $('app').style.display='none'; $('login').style.display='flex';
  window.ideaBubbleDestroy && ideaBubbleDestroy();
  try{
    const s = await fetch('/api/auth/status').then(r=>r.json());
    $('loginSub').textContent = s.setup ? 'ניהול לקוחות · מתודולוגיה · תהליכים' : 'הגדרת קוד גישה ראשוני (4 ספרות ומעלה)';
    $('loginBtn').textContent = s.setup ? 'כניסה' : 'הגדרת קוד וכניסה';
    $('login').dataset.setup = s.setup ? '1':'0';
  }catch(e){ $('loginErr').textContent='שגיאת חיבור לשרת'; }
  $('pin').focus();
}
async function doLogin(){
  const pin = $('pin').value.trim();
  const isSetup = $('login').dataset.setup==='0';
  $('loginErr').textContent='';
  if(pin.length<4){ $('loginErr').textContent='קוד קצר מדי'; return; }
  try{
    const r = await apiPost(isSetup?'/auth/setup':'/auth/login',{pin});
    TOKEN=r.token; localStorage.setItem(TOKEN_KEY,TOKEN);
    showApp();
  }catch(e){
    $('loginErr').textContent = e.message==='wrong_pin'?'קוד שגוי': e.message==='pin_too_short'?'קוד קצר מדי':'שגיאה, נסה שוב';
  }
}
$('pin')?.addEventListener('keydown',e=>{ if(e.key==='Enter') doLogin(); });
async function logout(){ try{ await apiPost('/auth/logout'); }catch(e){} TOKEN=''; localStorage.removeItem(TOKEN_KEY); showLogin(); }
function changePinForm(){
  openModal(`<h3>שינוי קוד גישה</h3>
    <div class="f"><label>קוד נוכחי</label><input type="password" id="f_cur" inputmode="numeric" autocomplete="off"></div>
    <div class="f"><label>קוד חדש (4 ספרות ומעלה)</label><input type="password" id="f_new" inputmode="numeric" autocomplete="off"></div>
    <div class="f"><label>אימות קוד חדש</label><input type="password" id="f_new2" inputmode="numeric" autocomplete="off"></div>
    <div class="modal-actions"><button class="btn primary" onclick="changePin()">עדכון</button>
      <button class="btn ghost" onclick="closeModal()">ביטול</button></div>`);
}
async function changePin(){
  const cur=val('f_cur'), n1=val('f_new'), n2=val('f_new2');
  if(n1.length<4){toast('הקוד החדש קצר מדי','bad');return;}
  if(n1!==n2){toast('הקודים אינם תואמים','bad');return;}
  try{ await apiPost('/auth/change',{currentPin:cur,newPin:n1}); closeModal(); toast('הקוד עודכן ✓'); }
  catch(e){ toast(e.message==='wrong_pin'?'הקוד הנוכחי שגוי': e.message==='pin_too_short'?'קוד קצר מדי':'שגיאה, נסה שוב','bad'); }
}

function showApp(){
  $('login').style.display='none'; $('app').style.display='block';
  buildNav(); go(CURRENT);
  window.ideaBubbleInit && ideaBubbleInit();
}

// ============ ניווט (BOS — ניווט ראשי בעברית) ============
const PAGES = [
  ['today','היום'],
  ['sales','מכירות'],
  ['customers','לקוחות'],
  ['work','עבודה'],
  ['finance','כספים'],
  ['growth','צמיחה'],
];
// תפריט משני / הגדרות (כולל מסכים ותיקים שנשמרו)
const SECONDARY = [
  ['leads','📥 לידים (CRM)'],
  ['calls','📞 תיעוד שיחות'],
  ['documents','מסמכים'],
  ['playbooks','ספריית מתודולוגיה'],
  ['skills','🧩 סקילז'],
  ['tasks','משימות'],
  ['modules','מודולים'],
  ['health','צינור עסקאות'],
  ['settings','⚙️ הגדרות'],
  ['dashboard','לוח בקרה (ישן)'],
];
// מיפוי עמוד → קבוצת ניווט (להדגשה בתפריט הראשי)
const NAV_GROUP = {
  today:'today',
  sales:'sales', opportunities:'sales', opportunity:'sales', proposals:'sales', leads:'sales',
  customers:'customers', clients:'customers', organizations:'customers', organization:'customers',
  calls:'customers', call:'customers',
  work:'work', projects:'work', project:'work', systems:'work', processes:'work',
  finance:'finance', engagements:'finance', cashflow:'finance', calculator:'finance',
  growth:'growth', ideas:'growth',
  settings:'settings',
  portfolio:'customers',
};
function buildNav(){
  const main = PAGES.map(([k,l])=>`<button data-p="${k}" class="${k===CURRENT?'on':''}" onclick="go('${k}')">${l}</button>`).join('');
  $('nav').innerHTML = main + `<button data-p="__more" onclick="moreMenu()">עוד ▾</button>`;
}
function moreMenu(){
  const items = SECONDARY.map(([k,l])=>`<button class="btn ghost" style="justify-content:flex-start;width:100%" onclick="closeModal();go('${k}')">${l}</button>`).join('');
  openModal(`<h3>עוד</h3><div class="col" style="gap:6px">${items}</div>
    <div class="modal-actions"><button class="btn ghost" onclick="closeModal()">סגירה</button></div>`);
}
function go(page){
  CURRENT=page;
  const navKey=NAV_GROUP[page]||page;
  document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('on',b.dataset.p===navKey));
  $('view').innerHTML='<div class="empty">טוען…</div>';
  (RENDER[page]||(()=> $('view').innerHTML='<div class="empty">בקרוב</div>'))();
  window.scrollTo(0,0);
}


// ============ מודאל ============
function openModal(html, wide){
  closeModal();
  const ov=document.createElement('div'); ov.className='overlay'; ov.id='modal';
  ov.innerHTML=`<div class="modal ${wide?'wide':''}">${html}</div>`;
  ov.addEventListener('click',e=>{ if(e.target===ov) closeModal(); });
  document.body.appendChild(ov);
}
function closeModal(){ $('modal')?.remove(); }
const val = (id)=> $(id)?.value?.trim() ?? '';
const valN = (id)=> Number($(id)?.value||0);

// ============ תוויות ============
const CLIENT_STATUS={prospect:['ליד','p-amber'],active:['פעיל','p-green'],paused:['בהמתנה','p-gray'],churned:['נטש','p-red']};
const CLIENT_STAGE={lead:'היכרות',discovery:'אבחון',proposal:'הצעת פתרון',building:'בנייה ויישום',live:'מסירה',retainer:'ליווי שוטף'};
const SYS_STATUS={discovery:['אפיון','p-amber'],design:['עיצוב','p-purple'],building:['בבנייה','p-blue'],live:['חי','p-green'],maintenance:['תחזוקה','p-teal'],retired:['הוקפא','p-gray']};
const ENG_MODEL={one_time:'חד-פעמי',retainer:'ריטיינר',hourly:'שעתי',revshare:'אחוז ממחזור',value:'מבוסס-ערך',hybrid:'היברידי'};
const ENG_STATUS={proposed:['מוצע','p-amber'],active:['פעיל','p-green'],paused:['מושהה','p-gray'],ended:['הסתיים','p-red']};
const HEALTH={green:['🟢','p-green'],yellow:['🟡','p-amber'],red:['🔴','p-red']};
const EFFORT={low:'נמוך',medium:'בינוני',high:'גבוה'};
const IDEA_STATUS={idea:['רעיון','p-gray'],exploring:['בבדיקה','p-amber'],pitched:['הוצע','p-blue'],active:['פעיל','p-green'],dropped:['נזנח','p-red']};
const DOC_CAT={live:['🌐','ממשק חי'],repo:['💻','קוד'],infra:['🗄️','תשתית'],guide:['📖','מדריך'],deck:['📊','מצגת'],design:['🎨','עיצוב'],security:['🔒','אבטחה'],devlog:['🗓️','יומן פיתוח'],ideas:['💡','רעיונות'],spec:['📋','מפרט'],doc:['📄','מסמך'],other:['🔗','אחר']};
const docIcon=(c)=>(DOC_CAT[c]||DOC_CAT.other)[0];
const docCatLabel=(c)=>(DOC_CAT[c]||DOC_CAT.other)[1];
const catOptions=(sel)=>Object.entries(DOC_CAT).map(([k,v])=>`<option value="${k}" ${k===sel?'selected':''}>${v[0]} ${v[1]}</option>`).join('');
const pill=(map,k)=>{const m=map[k]||[k,'p-gray'];return `<span class="pill ${m[1]}">${m[0]}</span>`;};
const STAGE_LABELS={discovery:'אפיון וגילוי',proposal:'הצעה והתקשרות',design:'תכנון ואדריכלות',build:'פיתוח',quality:'בדיקות ואיכות',security:'אבטחה ופרטיות',launch:'עלייה לאוויר',handoff:'מסירה ללקוח',care:'תחזוקה ותמיכה',advisory:'ליווי וייעוץ עסקי'};
const STAGE_ORDER=['discovery','proposal','design','build','quality','security','launch','handoff','care','advisory'];
const STAGE_EMOJI={discovery:'🔍',proposal:'📝',design:'🧭',build:'🛠️',quality:'✅',security:'🔒',launch:'🚀',handoff:'🤝',care:'🛡️',advisory:'📈'};
const PB_KIND={checklist:['צ׳ק־ליסט','p-blue'],template:['תבנית מסמך','p-purple'],canvas:['קנבס','p-teal']};
// תיעוד שיחה — מי יזם / אמצעי
const CALL_INITIATOR={me:'יזמתי אני',client:'הלקוח יזם',other:'גורם שלישי'};
const CALL_CHANNEL={phone:['📞','טלפון'],whatsapp:['💬','וואטסאפ'],video:['🎥','וידאו'],meeting:['🤝','פגישה'],other:['🔗','אחר']};
const callChannelIcon=(k)=>(CALL_CHANNEL[k]||CALL_CHANNEL.other)[0];
const callChannelLabel=(k)=>(CALL_CHANNEL[k]||CALL_CHANNEL.other)[1];

// ============ מסכים ============
const RENDER={};
let CACHE={clients:[],systems:[],engagements:[]};

  const [cl,sy,en]=await Promise.all([apiGet('/clients'),apiGet('/systems'),apiGet('/engagements')]);
  CACHE={clients:cl,systems:sy,engagements:en};
}
const clientOptions=(sel)=>`<option value="">— ללא —</option>`+CACHE.clients.map(c=>`<option value="${c.id}" ${c.id===sel?'selected':''}>${esc(c.name)}</option>`).join('');
const systemOptions=(sel,clientId)=>`<option value="">— ללא —</option>`+CACHE.systems.filter(s=>!clientId||s.clientId===clientId).map(s=>`<option value="${s.id}" ${s.id===sel?'selected':''}>${esc(s.name)}</option>`).join('');

// ---------- לוח בקרה ----------
RENDER.dashboard=async()=>{
  const [d,runs,clients]=await Promise.all([apiGet('/dashboard'),apiGet('/playbooks/runs'),apiGet('/clients')]);
  const k=d.kpis;
  const modelRows=Object.entries(d.byModel||{}).sort((a,b)=>b[1]-a[1]);
  const modelTotal=modelRows.reduce((a,[,v])=>a+v,0)||1;
  const activeRuns=runs.filter(r=>r.status==='active').slice(0,5);
  const PIPE_STAGES=[['lead','היכרות'],['discovery','אבחון'],['proposal','הצעת פתרון'],['building','בנייה ויישום'],['live','מסירה'],['retainer','ליווי שוטף']];
  const byStage={}; PIPE_STAGES.forEach(([k])=>byStage[k]=[]);
  clients.forEach(c=>{ if(byStage[c.stage]) byStage[c.stage].push(c); else if(c.status!=='churned') (byStage.lead=byStage.lead||[]).push(c); });
  const STAGE_EMOJI_CRM={lead:'👋',discovery:'🔍',proposal:'📋',building:'🛠️',live:'🚀',retainer:'🤝'};

const opts=(map,sel)=>Object.entries(map).map(([k,v])=>`<option value="${k}" ${k===sel?'selected':''}>${v}</option>`).join('');
const mapLabels=(m)=>Object.fromEntries(Object.entries(m).map(([k,v])=>[k,v[0]]));
async function saveClient(id){
  const body={name:val('f_name'),industry:val('f_industry'),size:val('f_size'),contactName:val('f_contactName'),contactRole:val('f_contactRole'),
    phone:val('f_phone'),email:val('f_email'),status:val('f_status'),stage:val('f_stage'),health:val('f_health'),notes:val('f_notes')};
  if(!body.name){toast('חסר שם','bad');return;}
  try{
    let cid=id;
    if(id){ await apiPatch('/clients/'+id,body); }
    else{ const r=await apiPost('/clients',body); cid=r.id; }
    closeModal(); toast('נשמר');
    // קישור אוטומטי: שלב חדש/שינוי שלב → פתיחת המהלך המתאים במתודולוגיה
    if(cid && (!id || body.stage!==CLIENT_EDIT_STAGE)){
      try{ const a=await apiPost('/playbooks/autolaunch',{clientId:cid,clientStage:body.stage});
        if(a.created) toast('נפתח מהלך: '+a.title); }catch(e){}
    }
    go('clients');
  }
  catch(e){toast('שגיאה: '+e.message,'bad');}
}

}

function handoffBuild(){
  const contact=val('h_contact')||'', sysname=val('h_sysname')||'המערכת';
  const landing=val('h_landing'), admin=val('h_admin'), creds=val('h_creds'), guide=val('h_guide');
  const desc=val('h_desc'), mods=val('h_mods');
  let m=`היי ${contact}, המערכת מוכנה עבורך 🎉\n\n`;
  m+=`${sysname}${desc?' — '+desc:''}\n`;
  if(landing) m+=`\n🌐 עמוד ציבורי:\n${landing}\n`;
  if(admin) m+=`\n🛠️ ממשק ניהול:\n${admin}\n`;
  if(creds) m+=`\n🔑 פרטי כניסה ראשונית:\n${creds}\n`;
  if(guide) m+=`\n📖 מדריך למערכת:\n${guide}\n`;
  if(mods) m+=`\nמה המערכת יודעת לעשות:\n${mods.split(', ').map(x=>'• '+x).join('\n')}\n`;
  if($('h_bubble')&&$('h_bubble').value) m+=`\n💡 בועת רעיונות:\nבפינת המסך תמצא בועה — לחיצה עליה מאפשרת לך לשלוח לי רעיון לשיפור או דיווח על באג תוך כדי עבודה, ואני מטפל. כך המערכת ממשיכה להשתפר בדיוק לפי הצורך שלך.\n`;
  if($('h_collab')&&$('h_collab').value) m+=`\n🤝 שיתופי פעולה (שת״פ):\nהמערכת מאפשרת לך לצרף שותפים ולמכור חבילות/תוספות להזמנה — מרכז רווח נוסף, עם מעקב הכנסה ורווחיות.\n`;
  m+=`\nמוזמן להיכנס, להתרשם ולשחק עם המערכת — היא בנויה בהתאמה אישית לעסק שלך. אשמח לשמוע התרשמות ולעבור יחד על הכל. 🙌`;
  const el=$('h_msg'); if(el) el.value=m;
}

// חישוב MRR בצד לקוח (תואם לשרת)
function engMonthly(e){
  const r=+e.monthlyFee||0,h=(+e.hourlyRate||0)*(+e.monthlyHours||0),rv=(+e.revshareBase||0)*((+e.revsharePercent||0)/100);
  switch(e.model){case 'retainer':case 'value':return r;case 'hourly':return h;case 'revshare':return rv;case 'one_time':return 0;case 'hybrid':return r+h+rv;default:return r;}
}

function pfToggle(head){ head.parentElement.classList.toggle('open'); }
function pfExpandAll(btn){
  const groups=document.querySelectorAll('.pf-group');
  const anyClosed=[...groups].some(g=>!g.classList.contains('open'));
  groups.forEach(g=>g.classList.toggle('open',anyClosed));
  if(btn) btn.textContent=anyClosed?'כווץ הכל':'הרחב הכל';

function pfFilter(){
  const q=($('pfS').value||'').trim().toLowerCase();
  document.querySelectorAll('.pf-group').forEach(g=>{
    const clientMatch=!q||(g.dataset.s||'').toLowerCase().includes(q);
    let shown=0;
    g.querySelectorAll('.pf-sys').forEach(r=>{ const m=clientMatch||!q||(r.dataset.s||'').toLowerCase().includes(q); r.style.display=m?'':'none'; if(m)shown++; });
    const show=clientMatch||shown>0;
    g.style.display=show?'':'none';
    if(q&&show) g.classList.add('open');
  });
}

function fuBadge(l){
  if(!l.followUpAt) return '';
  if(['won','lost'].includes(l.status||'new')) return '';
  const t=new Date(); t.setHours(0,0,0,0);
  const d=new Date(l.followUpAt); d.setHours(0,0,0,0);
  if(d.getTime()<t.getTime()) return '<span class="pill p-red">⏰ באיחור</span>';
  if(d.getTime()===t.getTime()) return '<span class="pill p-amber">⏰ היום</span>';
  return '<span class="pill p-gray">📅 '+new Date(l.followUpAt).toLocaleDateString('he-IL',{day:'numeric',month:'numeric'})+'</span>';
}
const fuDue=(l)=>{ if(!l.followUpAt||['won','lost'].includes(l.status||'new'))return false; const e=new Date(); e.setHours(23,59,59,999); return l.followUpAt<=e.getTime(); };
function leadPhone(note){ const m=(note||'').match(/0\d[\d\- ]{7,11}/); return m? m[0].replace(/\D/g,'') : ''; }
function waNum(p){ p=(p||'').replace(/\D/g,''); if(p.startsWith('972'))return p; if(p.startsWith('0'))return '972'+p.slice(1); return p; }
function timeAgo(ms){ const s=Math.floor((Date.now()-ms)/1000); if(s<60)return 'הרגע'; const m=Math.floor(s/60); if(m<60)return "לפני "+m+" דק'"; const h=Math.floor(m/60); if(h<24)return "לפני "+h+" ש'"; const d=Math.floor(h/24); if(d<30)return "לפני "+d+" ימים"; return new Date(ms).toLocaleDateString('he-IL'); }

function leadConvert(id){
  const l=LEADS_ALL.find(x=>x.id===id); if(!l)return;
  if(l.convertedClientId){ toast('הליד כבר הומר ללקוח — פותח את הכרטיס'); closeModal(); openClient(l.convertedClientId); return; }
  const ph=leadPhoneOf(l);
  const indM=(l.note||'').match(/תחום:\s*([^·]+)/);
  const inputStyle='width:100%;padding:9px 11px;border:1.5px solid #d9d2c4;border-radius:9px;font-family:inherit;font-size:.95rem;background:#fff';
  openModal(
    '<h3 style="margin:0 0 4px">🤝 הפוך ללקוח</h3>'+
    '<div class="muted" style="font-size:.88rem;margin-bottom:14px">ייווצר כרטיס לקוח חדש מהליד, הליד יסומן כ"✅ נסגר" והמעבר יתועד ביומן הפעילות.</div>'+
    '<div class="f"><label>שם הלקוח / העסק <b style="color:#a8452f">*</b></label><input id="cv_name" value="'+esc(l.name||'')+'" style="'+inputStyle+'"></div>'+
    '<div class="f2" style="margin-top:10px">'+
      '<div class="f"><label>תחום</label><input id="cv_industry" value="'+esc(indM?indM[1].trim():'')+'" placeholder="קליניקה, צימרים…" style="'+inputStyle+'"></div>'+
      '<div class="f"><label>טלפון</label><input id="cv_phone" value="'+esc(ph)+'" style="'+inputStyle+'"></div>'+
    '</div>'+
    '<div class="f" style="margin-top:10px"><label>הערות</label><textarea id="cv_notes" rows="3" style="'+inputStyle+'">'+esc('נוצר מליד ('+(LEAD_SOURCES[l.source]||l.source||'אתר')+'): '+(l.note||''))+'</textarea></div>'+
    '<div class="spread" style="margin-top:16px"><button class="btn ghost" onclick="closeModal()">ביטול</button><button class="btn primary" onclick="leadConvertDo(\''+l.id+'\')">🤝 צור לקוח</button></div>'
  );
}

async function leadConvertDo(id){
  const l=LEADS_ALL.find(x=>x.id===id); if(!l)return;
  if(l.convertedClientId){ toast('הליד כבר הומר ללקוח','bad'); return; }
  const name=val('cv_name'); if(!name){ toast('חסר שם לקוח','bad'); return; }
  try{
    const r=await apiPost('/clients',{name, industry:val('cv_industry')||null, phone:val('cv_phone')||null,
      contactName:l.name||null, status:'prospect', stage:'lead', health:'green', notes:val('cv_notes')||null});
    await apiPatch('/leads/'+id,{status:'won', convertedClientId:(r&&r.id)||null});
    l.status='won'; l.handledAt=Date.now(); l.convertedClientId=(r&&r.id)||null;
    apiPost('/leads/'+id+'/activities',{kind:'note',text:'🤝 הפך ללקוח: '+name}).catch(()=>{});
    closeModal(); toast('🤝 נוצר לקוח חדש ✓'); renderLeadsList();
    if(r&&r.id) openClient(r.id);
  }catch(e){ toast('שגיאה ביצירת הלקוח','bad'); }
}

async function loadLeadActivities(id){
  const box=$('actList'); if(!box)return;
  try{
    const rows=await apiGet('/leads/'+id+'/activities');
    box.innerHTML= rows.length? rows.map(a=>{
      const k=ACT_KINDS[a.kind]||ACT_KINDS.note;
      return '<div class="stat-row"><span>'+k[0]+' '+esc(a.text||k[1])+'</span><span class="muted" style="font-size:.8rem;flex:none">'+new Date(a.createdAt).toLocaleString('he-IL',{day:'numeric',month:'numeric',hour:'2-digit',minute:'2-digit'})+'</span></div>';
    }).join('') : '<div class="muted hint">אין תיעוד עדיין — רשום את הפעולה הראשונה 👆</div>';
  }catch(e){ box.innerHTML='<div class="muted hint">שגיאה בטעינת היומן</div>'; }
}

async function leadAddActivity(id){
  const kind=($('actKind')&&$('actKind').value)||'note';
  const text=(($('actText')&&$('actText').value)||'').trim();
  if(!text){ toast('כתוב קודם מה קרה','bad'); return; }
  try{ await apiPost('/leads/'+id+'/activities',{kind,text}); if($('actText'))$('actText').value=''; toast('נרשם ביומן ✓'); loadLeadActivities(id); }
  catch(e){ toast('שגיאה ברישום','bad'); }
}

async function leadSetFollowUp(id,dateStr){
  const ts=dateStr? new Date(dateStr+'T09:00:00').getTime() : null;
  try{
    await apiPatch('/leads/'+id,{followUpAt:ts});
    const l=LEADS_ALL.find(x=>x.id===id); if(l)l.followUpAt=ts;
    toast(ts?'נקבעה חזרה ✓':'החזרה בוטלה'); renderLeadsList();
  }catch(e){ toast('שגיאה בעדכון','bad'); }
}

async function leadSetStatus(id,status){
  try{
    await apiPatch('/leads/'+id,{status});
    const l=LEADS_ALL.find(x=>x.id===id); if(l){l.status=status;l.handledAt=Date.now();}
    // תיעוד אוטומטי ביומן הפעילות
    apiPost('/leads/'+id+'/activities',{kind:'status',text:'הסטטוס שונה ל: '+(LEAD_STATUS[status]?LEAD_STATUS[status][0]:status)}).then(()=>loadLeadActivities(id)).catch(()=>{});
    toast('סטטוס עודכן ✓'); renderLeadsList();
  }catch(e){ toast('שגיאה בעדכון הסטטוס','bad'); }
}
async function leadDelete(id){
  if(!confirm('למחוק את הליד לצמיתות?'))return;
  try{ await apiDel('/leads/'+id); LEADS_ALL=LEADS_ALL.filter(x=>x.id!==id); closeModal(); toast('הליד נמחק'); renderLeadsList(); }
  catch(e){ toast('שגיאה במחיקה','bad'); }
}

function calcInputs(){

    buildHours:valN('c_buildHours'), costRate:valN('c_costRate'), sellRate:valN('c_sellRate'),

    clientValue:valN('c_clientValue'), capturePct:valN('c_capturePct'),
    monthlyCost:valN('c_monthlyCost'), months:valN('c_months')||12, vat:$('c_vat')?.checked,
    extras:CALC_EXTRAS.map(e=>({name:e.name,amount:+e.amount||0,kind:e.kind})),
    extraSetup:CALC_EXTRAS.filter(e=>e.kind==='setup').reduce((a,e)=>a+(+e.amount||0),0),
    extraMonthly:CALC_EXTRAS.filter(e=>e.kind==='monthly').reduce((a,e)=>a+(+e.amount||0),0),
  };
}
// חישוב מודל בודד לפי אותם משתני קלט
function computeModel(model,I){
  const build = I.setupFee>0 ? I.setupFee : I.buildHours*I.sellRate;
  let setup=0, monthly=0;
  switch(model){
    case 'one_time': setup=build; monthly=0; break;
    case 'retainer': setup=build; monthly=I.monthlyFee; break;
    case 'hourly':   setup=I.setupFee; monthly=I.sellRate*I.monthlyHours; break;
    case 'revshare': setup=I.setupFee; monthly=I.clientRevenue*I.sharePct/100; break;
    case 'value':    setup=I.setupFee; monthly=I.clientValue*I.capturePct/100; break;
    case 'hybrid':   setup=build; monthly=I.monthlyFee + I.clientRevenue*I.sharePct/100; break;
  }
  // משתנים חופשיים (רכיבי הצעה נוספים) נכנסים לכל מודל
  setup += I.extraSetup||0;
  monthly += I.extraMonthly||0;
  const months=I.months;
  const buildCost=I.buildHours*I.costRate;
  const deliverCost=I.monthlyHours*I.costRate;               // עלות שעות תמיכה חודשיות
  const monthlyCostTotal=I.monthlyCost + deliverCost;
  const totalRevenue=setup + monthly*months;
  const totalCost=buildCost + monthlyCostTotal*months;
  const profit=totalRevenue-totalCost;
  const margin=totalRevenue>0?profit/totalRevenue:0;
  const totalHours=I.buildHours + I.monthlyHours*months;
  const effHourly=totalHours>0?totalRevenue/totalHours:0;
  const monthlyNet=monthly-monthlyCostTotal;
  const breakEven = monthlyNet>0 ? Math.ceil(Math.max(0,(buildCost-setup))/monthlyNet) : null;
  return {model,setup,monthly,buildCost,monthlyCostTotal,totalRevenue,totalCost,profit,margin,effHourly,breakEven};
}

    </div>`;

async function saveScenario(){
  const name=prompt('שם התרחיש:'); if(!name)return;
  const I=calcInputs(); const results=CALC_MODELS.map(m=>computeModel(m,I));
  const best=results.reduce((a,b)=>b.profit>a.profit?b:a,results[0]);
  try{ await apiPost('/finance/scenarios',{name,model:best.model,inputs:I,results:{best,all:results}}); toast('התרחיש נשמר'); }
  catch(e){toast('שגיאה','bad');}
}
async function loadScenarios(){
  // תרחישי מחשבון החיוב בלבד — תרחישי What-if (model='whatif') חיים במסך כספים ← תרחישים
  const list=(await apiGet('/finance/scenarios')).filter(s=>s.model!=='whatif');
  openModal(`<h3>תרחישים שמורים</h3>${list.length?list.map(s=>{const r=JSON.parse(s.results||'{}').best||{};return `
    <div class="list-item"><div class="li-main"><b>${esc(s.name)}</b><small>${ENG_MODEL[s.model]||s.model} ${s.clientName?'· '+esc(s.clientName):''} · רווח ${money(r.profit||0)}</small></div>
      <button class="btn danger small" onclick="delScenario('${s.id}')">מחק</button></div>`;}).join(''):'<div class="empty">אין תרחישים שמורים</div>'}
    <div class="modal-actions"><button class="btn ghost" onclick="closeModal()">סגירה</button></div>`);
}
async function delScenario(id){ await apiDel('/finance/scenarios/'+id); loadScenarios(); toast('נמחק'); }
function scenarioToEngagement(){
  const I=calcInputs(); const best=CALC_MODELS.map(m=>computeModel(m,I)).reduce((a,b)=>b.profit>a.profit?b:a);
  go('engagements');
  setTimeout(()=>engagementForm({model:best.model,setupFee:Math.round(best.setup),monthlyFee:best.model==='retainer'||best.model==='hybrid'||best.model==='value'?Math.round(best.monthly):0,

}

function quoteSyncRuns(preselect){

// טופס הפקת קבלה על עסקה שהושלמה
function receiptForm(deal){
  const paidSoFar=(deal.receipts||[]).filter(r=>r.kind==='receipt').reduce((a,r)=>a+Number(r.amount||0),0)
                  -(deal.receipts||[]).filter(r=>r.kind==='credit').reduce((a,r)=>a+Number(r.amount||0),0);

    '<h3 style="margin:0 0 4px">🧾 הפקת קבלה</h3>'+
    '<div class="muted" style="font-size:.88rem;margin-bottom:14px">'+esc(deal.clientName||'')+'</div>'+
    '<div class="f"><label>סכום</label><input id="rc_amount" type="number" min="0" value="'+(remaining||deal.totalAmount||0)+'" style="width:100%;padding:9px 11px;border:1.5px solid #d9d2c4;border-radius:9px;font-family:inherit;font-size:.95rem"></div>'+
    '<div class="f" style="margin-top:10px"><label>אמצעי תשלום</label><select id="rc_method" style="width:100%;padding:9px 11px;border:1.5px solid #d9d2c4;border-radius:9px;font-family:inherit;font-size:.95rem">'+
      Object.entries(PAY_METHOD_LABEL).map(([k,l])=>'<option value="'+k+'">'+l+'</option>').join('')+'</select></div>'+
    '<div class="f" style="margin-top:10px"><label>תיאור השירות/המוצר</label><input id="rc_desc" value="'+esc(deal.title||'')+'" style="width:100%;padding:9px 11px;border:1.5px solid #d9d2c4;border-radius:9px;font-family:inherit;font-size:.95rem"></div>'+
    '<div class="f" style="margin-top:10px"><label>שם הלקוח (לא חובה)</label><input id="rc_customer" value="'+esc(deal.clientName||'')+'" style="width:100%;padding:9px 11px;border:1.5px solid #d9d2c4;border-radius:9px;font-family:inherit;font-size:.95rem"></div>'+
    '<div class="f" style="margin-top:10px"><label>שם המנפיק</label><input id="rc_issuer" style="width:100%;padding:9px 11px;border:1.5px solid #d9d2c4;border-radius:9px;font-family:inherit;font-size:.95rem"></div>'+
    '<div class="spread" style="margin-top:16px"><button class="btn ghost" onclick="closeModal()">ביטול</button><button class="btn primary" onclick="receiptSubmit(\''+deal.id+'\')">🧾 הפק קבלה</button></div>'
  , true);
  ensureBiz().then(biz=>{ const el=$('rc_issuer'); if(el&&!el.value) el.value=biz.issuerName||''; });
}
async function receiptSubmit(dealId){
  const amount=Number(val('rc_amount')||0);
  const paymentMethod=val('rc_method');
  const description=val('rc_desc');
  const customerName=val('rc_customer');
  const issuerName=val('rc_issuer');
  if(!(amount>0)){ toast('סכום לא תקין','bad'); return; }
  if(!description){ toast('חסר תיאור','bad'); return; }
  if(!issuerName){ toast('חסר שם מנפיק — יש להשלים בהגדרות עסק או כאן','bad'); return; }
  let receipt;
  try{ receipt=await apiPost('/sales/deals/'+dealId+'/receipts',{amount,paymentMethod,description,customerName,issuerName}); }
  catch(e){
    const msg=e.message==='business_settings_incomplete'?'יש להשלים מספר עוסק/כתובת/שם מנפיק בהגדרות → פרטי עסק'
      :e.message==='deal_not_completed'?'יש לסמן את ההזמנה כהושלמה לפני הפקת קבלה':'שגיאה בהפקת הקבלה';
    toast(msg,'bad'); return;
  }
  closeModal();
  toast('קבלה #'+receipt.receiptNo+' הופקה ✓');
  await receiptRenderPrint(receipt);
  if(CURRENT==='sales') go('sales');
}

async function creditNoteSubmit(receiptId){
  const amount=Number(val('cr_amount')||0);
  const reason=val('cr_reason');
  if(!(amount>0)){ toast('סכום לא תקין','bad'); return; }
  if(!reason){ toast('חובה לציין סיבת זיכוי','bad'); return; }
  let credit;
  try{ credit=await apiPost('/sales/receipts/'+receiptId+'/credit',{amount,reason}); }
  catch(e){
    const msg=e.message==='business_settings_incomplete'?'יש להשלים מספר עוסק/כתובת בהגדרות → פרטי עסק':'שגיאה בהפקת קבלת הזיכוי';
    toast(msg,'bad'); return;
  }
  closeModal();
  toast('קבלת זיכוי #'+credit.receiptNo+' הופקה ✓');
  await receiptRenderPrint(credit);
  if(CURRENT==='sales') go('sales');
}

function toggleCompose(){ COMPOSE=!COMPOSE; if(!COMPOSE) PB_SELECT.clear(); go('playbooks'); }
function clearSelect(){ PB_SELECT.clear(); go('playbooks'); }
function togglePbSelect(id){ PB_SELECT.has(id)?PB_SELECT.delete(id):PB_SELECT.add(id); go('playbooks'); }
function openPlaybook(id){
  const p=PB_CACHE.find(x=>x.id===id); if(!p)return;
  const secs=JSON.parse(p.sections||'[]');
  let inner;
  if(p.kind==='checklist'){
    inner=secs.map(sec=>`<div style="margin-bottom:12px"><b>${esc(sec.title||'')}</b>
      <ul class="pb-list">${(sec.items||[]).map(it=>`<li>${esc(it.label||'')}${it.hint?`<div class="hint">${esc(it.hint)}</div>`:''}</li>`).join('')}</ul></div>`).join('')||'<div class="hint">אין סעיפים</div>';
  } else {
    inner=`<pre class="pb-doc" id="pbDoc">${esc(p.body||'')}</pre>
      <button class="btn ghost small" type="button" onclick="copyPbDoc()">📋 העתקת המסמך</button>`;
  }
  openModal(`<div class="spread"><h3 style="margin:0">${STAGE_EMOJI[p.stage]||''} ${esc(p.title)}</h3>${pill(PB_KIND,p.kind)}</div>
    ${p.summary?`<div class="sub" style="margin:4px 0 14px">${esc(p.summary)}</div>`:'<div style="height:8px"></div>'}
    ${inner}
    <div class="modal-actions">
      <button class="btn primary" onclick="applyForm('${p.id}')">החל על עבודה →</button>
      <button class="btn ghost" onclick='playbookForm(${j(p)})'>עריכה</button>
      <button class="btn ghost" onclick="closeModal()">סגירה</button></div>`, true);
}

function togglePbKind(k){ $('pbChecklistEd').style.display=k==='checklist'?'block':'none'; $('pbBodyEd').style.display=k==='checklist'?'none':'block'; }
function renderPbSecs(){

  </div>`).join('')||'<div class="hint">אין סעיפים עדיין</div>';
}
function addPbSec(){ PBSECS.push({title:'',items:[{label:'',hint:''}]}); renderPbSecs(); }
function addPbItem(si){ PBSECS[si].items=PBSECS[si].items||[]; PBSECS[si].items.push({label:'',hint:''}); renderPbSecs(); }
async function savePlaybook(id){
  const kind=val('f_kind');
  const body={title:val('f_title'),stage:val('f_stage'),kind,summary:val('f_summary'),tags:val('f_tags')};
  if(!body.title){toast('חסרה כותרת','bad');return;}
  if(kind==='checklist') body.sections=PBSECS.map(s=>({title:s.title,items:(s.items||[]).filter(i=>i.label)})).filter(s=>s.title||s.items.length);
  else body.body=val('f_body');
  try{ id?await apiPatch('/playbooks/'+id,body):await apiPost('/playbooks',body); closeModal(); toast('נשמר ✓'); go('playbooks'); }catch(e){toast('שגיאה','bad');}
}

  openModal(`<h3>פתיחת מהלך חדש ללקוח</h3>
    <div class="sub" style="margin-bottom:12px">ייווצר טופס חי — שאלות + מקום לתשובות, מקושר לכרטיס הלקוח.</div>
    <div class="f"><label>פורמט</label><select id="f_pbId">${groups}</select></div>
    <div class="f"><label>מערכת (אופציונלי)</label><select id="f_systemId">${systemOptions('',clientId)}</select></div>

async function openRun(id){
  closeModal();
  let r; try{ r=await apiGet('/playbooks/runs/'+id); }catch(e){ toast('המהלך לא נמצא','bad'); go('playbooks'); return; }
  CURRENT='playbooks'; document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('on',b.dataset.p==='playbooks'));
  RUN={...r,_checked:JSON.parse(r.checked||'{}'),_answers:JSON.parse(r.answers||'{}'),_na:JSON.parse(r.na||'{}')};
  drawRun(); window.scrollTo(0,0);
}
function drawRun(){
  const isDoc=RUN.kind==='template'||RUN.kind==='canvas';
  const secs=JSON.parse(RUN.sections||'[]'); const ck=RUN._checked, ans=RUN._answers, na=RUN._na||(RUN._na={});
  let total=0,done=0,filled=0;
  secs.forEach((s,si)=>(s.items||[]).forEach((_,ii)=>{const k=si+'-'+ii; if(na[k])return; total++; if(ck[k])done++; if(String(ans[k]||'').trim())filled++;}));
  const prog=isDoc?(RUN.status==='done'?100:0):(total?Math.round(done/total*100):0);
  const counter=isDoc?'מסמך למילוי':`${done}/${total} · ${prog}% · ${filled} תשובות`;
  $('view').innerHTML=`
    <div class="row" style="gap:8px">
      <button class="btn ghost small" onclick="go('playbooks')">→ חזרה למתודולוגיה</button>
      ${RUN.clientId?`<button class="btn ghost small" onclick="openClient('${RUN.clientId}')">👤 כרטיס הלקוח</button>`:''}
    </div>
    <div class="spread" style="margin-top:10px"><div><h2 style="margin:0">${STAGE_EMOJI[RUN.stage]||''} ${esc(RUN.title)}</h2>
      <div class="sub">${RUN.clientName?esc(RUN.clientName):'כללי'}${RUN.systemName?' · '+esc(RUN.systemName):''} · ${STAGE_LABELS[RUN.stage]||''} · ${counter}</div></div>
      <div class="row">${RUN.status==='done'?'<span class="pill p-green">הושלם ✓</span>':`<button class="btn teal" onclick="finishRun()">סימון כהושלם</button>`}
        ${!isDoc?`<button class="btn teal" onclick="telegramInvite()" title="שליחת התהליך ללקוח למילוי עצמי בבוט Telegram — אותן שאלות, אותם שדות">📲 שליחה ללקוח</button>`:''}
        <button class="btn primary" onclick="runFormDoc()">📄 טופס מלא</button>
        <button class="btn ghost" onclick="runRenderPrint()" title="הפקת PDF על דף לוגו ORT-TECH — מוכן להדפסה או לצירוף להצעת מחיר">🖨️ הפקת PDF</button>
        ${(RUN.status==='done'&&RUN.clientId)?`<button class="btn teal" onclick="quoteFromCurrentRun()" title="צור הצעת מחיר ללקוח, מקושרת למהלך שהושלם">📄 הצעת מחיר</button>`:''}
        <button class="btn danger" onclick="delRun()">מחיקה</button></div></div>
    <div class="bar" style="margin:6px 0 16px"><span style="width:${prog}%"></span></div>
    ${!isDoc&&RUN.telegram?tgStatusCard(RUN.telegram):''}
    <div class="hint" style="margin-bottom:12px">${isDoc
      ? 'מלא את המסמך במקום ה-___ . נשמר אוטומטית ביציאה מהשדה. בסיום לחץ "טופס מלא" כדי לקבל אותו מוכן לשליחה.'
      : 'כתוב את התשובה מתחת לכל שאלה — היא נשמרת אוטומטית ומסמנת את הסעיף. בסיום לחץ "טופס מלא" כדי לקבל את הכל כמסמך אחד.'}</div>
    ${isDoc?`<div class="card"><h3>המסמך</h3>
      <textarea id="runDoc" class="pb-answer" rows="24" style="font-size:.87rem" placeholder="גוף המסמך…" onchange="saveRunDoc()">${esc(RUN.doc||'')}</textarea></div>`
    :(secs.map((s,si)=>`<div class="card">
      <h3>${esc(s.title||'')}</h3>
      ${(s.items||[]).map((it,ii)=>{const key=si+'-'+ii,isna=!!na[key],on=!isna&&!!ck[key],a=ans[key]||'';return `
        <div class="pb-item${on?' on':''}${isna?' na':''}">
          <div class="pb-head">
            <label class="pb-check${on?' on':''}">
              <input type="checkbox" ${on?'checked':''} ${isna?'disabled':''} onchange="toggleRun('${key}',this.checked)">
              <span><b>${esc(it.label||'')}</b>${it.hint?`<span class="hint">${esc(it.hint)}</span>`:''}</span></label>
            <button type="button" class="pb-na${isna?' on':''}" onclick="toggleRunNA('${key}')"
              title="סמן כלא רלוונטי — לא ייכלל בהדפסה ולא ייספר באחוז">${isna?'לא רלוונטי ✓':'לא רלוונטי'}</button>
          </div>
          ${isna?'<div class="na-note">— סומן כלא רלוונטי, לא ייכלל בטופס ובאחוז —</div>'
            :`<textarea class="pb-answer" id="ans_${key}" rows="${a?Math.min(8,a.split('\n').length+1):2}" placeholder="התשובה שלי…"
              oninput="RUN._answers['${key}']=this.value" onchange="saveRunAnswer('${key}')">${esc(a)}</textarea>`}
        </div>`;}).join('')}
    </div>`).join('')||'<div class="empty">לפורמט הזה אין פריטים</div>')}
    <div class="card"><h3>הערות כלליות</h3>
      <textarea id="runNotes" rows="3" placeholder="הערות למהלך…" onchange="saveRunNotes()">${esc(RUN.notes||'')}</textarea></div>`;
}
/** קולט את מה שהוקלד למסך לפני רענון, כדי שלא ילך לאיבוד */
function grabRunInputs(){
  document.querySelectorAll('.pb-answer[id^="ans_"]').forEach(t=>{ RUN._answers[t.id.slice(4)]=t.value; });
  const dc=$('runDoc'); if(dc) RUN.doc=dc.value;
  const nt=$('runNotes'); if(nt) RUN.notes=nt.value;
}
/** שומר את כל מצב המהלך (תמיד הכל, כדי שכלום שהוקלד לא ילך לאיבוד) */
async function saveRun(extra){
  const payload={checked:RUN._checked,answers:RUN._answers,na:RUN._na||{},notes:RUN.notes||'',...(extra||{})};
  if(RUN.doc!=null) payload.doc=RUN.doc;
  try{ const r=await apiPatch('/playbooks/runs/'+RUN.id,payload); if(r.progress!==undefined) RUN.progress=r.progress; return true; }
  catch(e){ toast('שגיאה בשמירה','bad'); return false; }
}
async function toggleRun(key,on){
  grabRunInputs();
  RUN._checked[key]=on; if(!on) delete RUN._checked[key];
  drawRun();
  await saveRun();
}
/** סימון "לא רלוונטי" — הפריט לא נספר באחוז ולא מודפס; מבטל סימון בוצע אם היה */
async function toggleRunNA(key){
  grabRunInputs();
  RUN._na=RUN._na||{};
  if(RUN._na[key]){ delete RUN._na[key]; }
  else { RUN._na[key]=true; delete RUN._checked[key]; }
  drawRun();
  await saveRun();
}
/** תשובה שנכתבה מסמנת אוטומטית את הסעיף כבוצע (ומחיקתה מבטלת) */
async function saveRunAnswer(key){
  grabRunInputs();
  const has=!!String(RUN._answers[key]||'').trim();
  const was=!!RUN._checked[key];
  if(has&&!was) RUN._checked[key]=true;
  if(!has&&was) delete RUN._checked[key];
  const ok=await saveRun();
  if(ok&&has!==was) drawRun();
}
async function saveRunDoc(){ grabRunInputs(); if(await saveRun()) toast('נשמר'); }
async function saveRunNotes(){ grabRunInputs(); if(await saveRun()) toast('נשמר'); }
async function finishRun(){ grabRunInputs(); if(await saveRun({status:'done'})){ RUN.status='done'; toast('הושלם ✓'); drawRun(); } }
async function delRun(){ if(!confirm('למחוק מהלך זה?'))return; await apiDel('/playbooks/runs/'+RUN.id); toast('נמחק'); go('playbooks'); }

    '.hdr{display:flex;justify-content:space-between;align-items:center;border-bottom:3px solid #0f7a5c;padding-bottom:16px;margin-bottom:20px}'+
    '.logo-crop{display:flex;align-items:center;justify-content:flex-end}.logo-crop img{height:54px;width:auto;display:block}'+

    'h1{font-size:23px;margin-bottom:2px}.meta{color:#6b7a8d;font-size:12.5px}'+
    '.mrun-sec{margin-top:16px;break-inside:avoid}'+

    '.mrun-hint{font-weight:400;color:#6b7a8d;font-size:11.5px;margin-inline-start:6px}'+

  const [clients,runs]=await Promise.all([apiGet('/clients'),apiGet('/playbooks/runs')]);
  HEALTH_CLIENTS=clients;
  const active=clients.filter(c=>c.status!=='churned').sort((a,b)=>String(a.name).localeCompare(String(b.name),'he'));
  const byClient={}; runs.forEach(r=>{ if(!r.clientId)return; (byClient[r.clientId]=byClient[r.clientId]||{}); (byClient[r.clientId][r.stage]=byClient[r.clientId][r.stage]||[]).push(r); });
  const cellFor=(cid,stage)=>{
    const rs=(byClient[cid]||{})[stage]||[];
    const done=rs.find(r=>r.status==='done'); if(done) return {kind:'done',run:done};
    const act=rs.filter(r=>r.status==='active').sort((a,b)=>b.progress-a.progress)[0]; if(act) return {kind:'active',run:act};
    return {kind:'none'};
  };
  const rows=active.map(c=>{ let passed=0; const cells=HEALTH_GATES.map(([st])=>{const x=cellFor(c.id,st); if(x.kind==='done')passed++; return {st,x};}); return {c,cells,passed}; });
  $('view').innerHTML=`
    <h2>צינור עסקאות</h2>
    <div class="sub">לכל לקוח — אילו שלבי המתודולוגיה הושלמו (✓), מה בעבודה (%) ומה עוד לא נפתח. לחיצה על תא פותחת מהלך קיים או יוצרת חדש.</div>
    ${active.length?`<div class="card tbl-wrap" style="margin-top:12px"><table>
      <thead><tr><th>לקוח</th>${HEALTH_GATES.map(([,l])=>`<th style="text-align:center">${l}</th>`).join('')}<th class="num">מוכנות</th></tr></thead>
      <tbody>${rows.map(row=>`<tr>
        <td><b style="cursor:pointer" onclick="openClient('${row.c.id}')">${esc(row.c.name)}</b><div class="hint">${CLIENT_STAGE[row.c.stage]||''}</div></td>
        ${row.cells.map(cl=>{const x=cl.x;
          if(x.kind==='done') return `<td style="text-align:center;cursor:pointer" onclick="openRun('${x.run.id}')"><span class="pill p-green">✓</span></td>`;
          if(x.kind==='active') return `<td style="text-align:center;cursor:pointer" onclick="openRun('${x.run.id}')"><span class="pill p-amber">${x.run.progress}%</span></td>`;
          return `<td style="text-align:center;cursor:pointer" title="פתיחת מהלך" onclick="launchGate('${row.c.id}','${cl.st}')"><span class="muted" style="font-size:1.1rem">＋</span></td>`;
        }).join('')}
        <td class="num"><b>${row.passed}/${HEALTH_GATES.length}</b></td>
      </tr>`).join('')}</tbody></table></div>`:'<div class="empty">אין לקוחות פעילים עדיין</div>'}
    <div class="hint" style="margin-top:10px">✓ שלב שהושלם · צהוב = מהלך פעיל (אחוז) · ＋ = פתיחת מהלך חדש · לחיצה על שם לקוח פותחת את הכרטיס</div>`;
};
async function launchGate(clientId,stage){
  const pb=GATE_PB[stage]; if(!pb)return;
  const name=HEALTH_CLIENTS.find(c=>c.id===clientId)?.name||'הלקוח';
  if(!confirm('לפתוח מהלך "'+(GATE_LABEL[stage]||'')+'" עבור '+name+'?'))return;
  try{ const r=await apiPost('/playbooks/'+pb+'/apply',{clientId}); toast('המהלך נוצר ✓'); openRun(r.id); }
  catch(e){ toast('שגיאה — ודא שהתבנית קיימת','bad'); }
}

    if(t.entityType==='client') return '<span class="tag">👤 '+esc(cmap[t.entityId]||'לקוח')+'</span>';
    if(t.entityType) return '<span class="tag">'+esc(entityLabel(t.entityType))+'</span>';

  const byDue=(a,b)=>{ const x=a.dueDate||'9999-99-99', y=b.dueDate||'9999-99-99'; return x<y?-1:x>y?1:(b.createdAt||0)-(a.createdAt||0); };

          </div>`).join('')||'<div class="empty">—</div>'}

async function saveTask(id,returnClientId,returnKind){
  const body={title:val('f_title'),status:val('f_status'),priority:val('f_priority'),dueDate:val('f_dueDate'),details:val('f_details')};
  if(!body.title){toast('חסרה כותרת','bad');return;}
  const sel=$('f_client'); // קיים רק למשימות ניתנות-לשיוך-לקוח (כללי או לקוח)
  if(sel){ const cid=sel.value; body.entityType=cid?'client':null; body.entityId=cid||null; }
  try{
    id?await apiPatch('/tasks/'+id,body):await apiPost('/tasks',body);
    closeModal(); toast('נשמר');
    if(returnClientId) reopenClientCard(returnClientId,returnKind); else go('tasks');
  }catch(e){toast('שגיאה','bad');}
}
async function delTask(id,returnClientId,returnKind){ if(!confirm('למחוק?'))return; await apiDel('/tasks/'+id); closeModal(); toast('נמחק'); if(returnClientId) reopenClientCard(returnClientId,returnKind); else go('tasks'); }

async function saveCall(id){
  const whenRaw=$('c_when')?.value||'';
  const occurredAt=whenRaw?new Date(whenRaw).getTime():Date.now();
  const clientSel=$('c_client'); const clientId=clientSel?clientSel.value:'';
  const clientName=clientSel&&clientId?clientSel.options[clientSel.selectedIndex].text:'';
  const body={
    clientId:clientId||null, clientName:clientName||null,
    contactName:val('c_contact')||null,
    initiator:val('c_initiator')||'me', channel:val('c_channel')||'phone',
    occurredAt, durationMin:$('c_duration')?.value||null,
    discussed:val('c_discussed')||null, agreed:val('c_agreed')||null, notes:val('c_notes')||null,
  };
  if(id){
    body.ideas=val('c_ideas')||null;
    try{ await apiPatch('/calls/'+id,body); closeModal(); toast('עודכן ✓'); openCall(id); }
    catch(e){ toast('שגיאה','bad'); }
    return;
  }
  // איסוף שורות דינמיות

    title:r.querySelector('.ci_title')?.value.trim()||'', potentialMonthly:Number(r.querySelector('.ci_monthly')?.value||0),
  })).filter(x=>x.title);
  const derivedTasks=[...document.querySelectorAll('.c_taskRow')].map(r=>({
    title:r.querySelector('.ct_title')?.value.trim()||'', priority:r.querySelector('.ct_priority')?.value||'normal', dueDate:r.querySelector('.ct_due')?.value||null,
  })).filter(x=>x.title);
  body.ideas=derivedIdeas.map(i=>i.title).join('\n')||null; // גיבוי טקסטואלי
  body.derivedIdeas=derivedIdeas; body.derivedTasks=derivedTasks;
  if(!body.discussed&&!body.agreed&&!derivedTasks.length&&!derivedIdeas.length){ toast('כתוב לפחות מה דובר / מה סוכם','bad'); return; }
  try{
    const r=await apiPost('/calls',body);
    closeModal();
    toast(`השיחה תועדה ✓${r.taskCount?` · ${r.taskCount} משימות`:''}${r.ideaCount?` · ${r.ideaCount} רעיונות`:''}`);

  }catch(e){ toast('שגיאה','bad'); }
}

// ---------- מקורות הסקילז ----------
// לכל מקור: מאיפה משכפלים, איפה יושב כל סקיל בתוך הריפו, ואיך מנסחים נתיב גישה קריא.
// הנתיב הקריא (ref) הוא מה שנשמר ב-DB לצד כל סימון "מותקן ב…", כדי שנדע לחזור לסקיל גם בעוד שנה.
const SK_SOURCES={
  ecc:{ id:'ecc', label:'ECC', full:'affaan-m/ecc', icon:'🧩', url:'https://github.com/affaan-m/ecc',
    ref:(name,type)=> type==='cmd' ? 'affaan-m/ecc/commands/'+name+'.md' : 'affaan-m/ecc/skills/'+name,
    link:(name,type)=> 'https://github.com/affaan-m/ecc/tree/main/'+(type==='cmd'?'commands/'+name+'.md':'skills/'+name) },
  'skills-il':{ id:'skills-il', label:'Skills IL', full:'github.com/skills-il', icon:'🇮🇱', url:'https://github.com/skills-il', site:'https://agentskills.co.il',
    ref:(name,repo)=> 'skills-il/'+repo+'/'+name,
    link:(name,repo)=> 'https://github.com/skills-il/'+repo+'/tree/main/'+name },
};
const IL_DATA=()=>window.SKILLS_IL_DATA||[];
const IL_CATS=()=>window.SK_IL_CATS||[];
const IL_BUNDLES=()=>window.SK_IL_BUNDLES||[];
function ilItem(name){ return IL_DATA().find(x=>x[0]===name)||null; }
function eccItem(name,type){ return (type==='cmd'?CMDS_DATA:SKILLS_DATA).find(x=>x[0]===name)||null; }
// מזהה בחירה → { source, name, type, ref, link }
function skResolve(id){
  const i=id.indexOf(':'); const kind=id.slice(0,i), name=id.slice(i+1);
  if(kind==='il'){ const it=ilItem(name); const repo=it?it[1]:'?'; const S=SK_SOURCES['skills-il']; return { source:'skills-il', name, type:'skill', repo, ref:S.ref(name,repo), link:S.link(name,repo) }; }
  const S=SK_SOURCES.ecc; return { source:'ecc', name, type:kind, ref:S.ref(name,kind), link:S.link(name,kind) };
}
// מפתח השימוש ב-DB: "<source>:<name>" (פקודה וסקיל ב-ECC חולקים מפתח — כמו קודם)
function skUseKey(source,name){ return source+':'+name; }

let SK_VIEW='all', SK_STAR=false, SK_CAT='', SK_USED=false;
let SK_WITHINSTR=(function(){try{return localStorage.getItem('skInstr')!=='0';}catch(e){return true;}})();
function skSetInstr(v){ SK_WITHINSTR=v; try{localStorage.setItem('skInstr',v?'1':'0');}catch(e){} }
const SK_SEL=new Set(); // בחירה מרובה: 'skill:<name>' / 'cmd:<name>' (ECC) / 'il:<name>' (skills-il)
function skCopy(name,type){
  const t=(type==='cmd'?'/':'')+name; let ok=false;
  try{ if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(t);ok=true;} }catch(e){}
  if(!ok){ const ta=document.createElement('textarea'); ta.value=t; ta.style.position='fixed'; ta.style.left='-9999px'; document.body.appendChild(ta); ta.select(); try{document.execCommand('copy');}catch(e){} ta.remove(); }
  toast('הועתק: '+t);
}
// שימוש בסקילז לפי מערכת — נתונים חיים מה-DB (נטענים ב-RENDER.skills)
let SK_USAGE={};   // { "<source>:<skillName>": [{id, source, sourceRef, systemId, systemName}] }
let SK_SYS=[];     // רשימת המערכות לבורר
// פריט בקטלוג. type: 'skill' | 'cmd' (ECC) | 'il' (skills-il)
function skItemHtml(it,type){
  const name=it[0], desc=it[2];
  const isIl=type==='il';
  const source=isIl?'skills-il':'ecc';
  const star=(type==='skill'||isIl)&&it[3]===1;
  const rel=type==='cmd'?it[3]:'';
  const uses=SK_USAGE[skUseKey(source,name)]||null;
  const label=(type==='cmd'?'/':'')+name;
  const heName=isIl?(it[4]||''):'';
  const fullDesc=isIl?(it[5]||''):'';
  const R=skResolve(type+':'+name);
  const useNames=uses?uses.map(u=>u.systemName).join(' '):'';
  const s=esc((name+' '+desc+' '+heName+' '+fullDesc+' '+(rel||'')+' '+R.ref+' '+useNames).toLowerCase());
  let relHtml='';
  if(rel){ relHtml='<div class="sk-rel"><span class="t" style="border-color:transparent;background:none;padding-inline:0">שייך ל:</span>'+rel.split(',').map(x=>'<span class="t">'+esc(x)+'</span>').join('')+'</div>'; }
  const chips=(uses||[]).map(u=>'<span class="sk-use" onclick="event.stopPropagation();skUsageDel(\''+u.id+'\')" title="הסר סימון">'+esc(u.systemName)+' ✕</span>').join('');
  const instHtml='<div class="sk-inst-row">'+((uses&&uses.length)?'<span class="sk-inst-lbl">✅ בשימוש:</span>'+chips:'')+'<button class="sk-use-add" onclick="event.stopPropagation();skUsageAdd(\''+esc(name)+'\',\''+source+'\')">+ סמן מערכת</button></div>';
  // נתיב הגישה כטקסט (לחיצה עליו בוחרת את הכרטיס) + קישור קטן נפרד ל-GitHub
  const srcHtml='<div class="sk-src" title="נתיב הגישה לסקיל (נשמר עם כל סימון התקנה)"><span>📍 '+esc(R.ref)+'</span> <a href="'+esc(R.link)+'" target="_blank" rel="noopener" title="פתיחה ב-GitHub" onclick="event.stopPropagation()">↗</a></div>';
  const id=type+':'+name;
  return '<div class="sk-item '+type+(star?' star':'')+((uses&&uses.length)?' inst':'')+(SK_SEL.has(id)?' sel':'')+'" data-id="'+id+'" data-type="'+type+'" data-src="'+source+'" data-star="'+(star?1:0)+'" data-inst="'+((uses&&uses.length)?1:0)+'" data-s="'+s+'"'+(fullDesc?' title="'+esc(fullDesc)+'"':'')+' onclick="skToggleSel(\''+esc(name)+'\',\''+type+'\',this)">'
    +'<span class="sk-cb"></span>'
    +(star?'<span class="sk-star-tag">⭐</span>':'')
    +'<div class="sk-name">'+esc(label)+'</div>'+(heName?'<div class="sk-he">'+esc(heName)+'</div>':'')+'<div class="sk-desc">'+esc(desc)+'</div>'+relHtml+srcHtml+instHtml+'</div>';
}
