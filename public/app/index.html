  h+='<div class="row" style="margin-bottom:14px"><input id="skq" class="search" placeholder="חיפוש לפי שם, תיאור או נתיב…" oninput="skApply()">'
    +'<div class="seg" style="flex:0 0 auto">'+[['all','הכל'],['skill','סקילז ECC'],['cmd','פקודות'],['il','Skills IL 🇮🇱']].map(v=>'<button class="'+(SK_VIEW===v[0]?'on':'')+'" onclick="skView(\''+v[0]+'\',this)">'+v[1]+'</button>').join('')+'</div>'
    +'<select id="skCat" class="search" style="max-width:210px;flex:0 0 auto" onchange="skSetCat(this.value)"><option value="">כל הקטגוריות</option>'
    +'<option value="" disabled>──── ECC ────</option>'+SK_CATS.map(c=>'<option value="'+c[0]+'"'+(SK_CAT===c[0]?' selected':'')+'>'+c[2]+' '+c[1]+'</option>').join('')
    +'<option value="" disabled>──── פקודות ────</option>'+SK_CMDG.map(c=>'<option value="'+c[0]+'"'+(SK_CAT===c[0]?' selected':'')+'>'+c[2]+' '+c[1]+'</option>').join('')
    +'<option value="" disabled>──── Skills IL ────</option>'+ILC.map(c=>'<option value="il-'+c[0]+'"'+(SK_CAT==='il-'+c[0]?' selected':'')+'>'+c[2]+' '+c[1]+'</option>').join('')+'</select>'
    +'<button class="btn small'+(SK_STAR?' teal':'')+'" onclick="skStarToggle(this)">⭐ רלוונטי לי</button>'
    +'<button class="btn small'+(SK_USED?' teal':'')+'" onclick="skUsedToggle(this)">✅ בשימוש</button></div>';
  h+='<div class="card"><h3>💾 מקורות ונתיבי גישה</h3><div class="muted" style="font-size:.85rem;line-height:1.8">'
    +'<div><b>🧩 ECC</b> — <a href="https://github.com/affaan-m/ecc" target="_blank" rel="noopener" style="direction:ltr">affaan-m/ecc</a>: סקיל יושב ב-<span class="tag" style="direction:ltr">skills/&lt;שם&gt;/SKILL.md</span>, פקודה ב-<span class="tag" style="direction:ltr">commands/&lt;שם&gt;.md</span> (מורצת עם <span class="tag" style="direction:ltr">/שם</span>).</div>'
    +'<div><b>🇮🇱 Skills IL</b> — <a href="https://github.com/skills-il" target="_blank" rel="noopener" style="direction:ltr">github.com/skills-il</a> · <a href="https://agentskills.co.il" target="_blank" rel="noopener" style="direction:ltr">agentskills.co.il</a>: הארגון מחולק לריפו לכל קטגוריה, וכל סקיל הוא תיקייה <span class="tag" style="direction:ltr">&lt;ריפו&gt;/&lt;שם&gt;/SKILL.md</span> (לרוב עם <span class="tag" style="direction:ltr">scripts/</span> ו-<span class="tag" style="direction:ltr">references/</span>). התקנה: העתקת התיקייה ל-<span class="tag" style="direction:ltr">.claude/skills/&lt;שם&gt;/</span>, או <span class="tag" style="direction:ltr">npx skills-il add skills-il/&lt;ריפו&gt; --skill &lt;שם&gt;</span>.</div>'
    +'<div>בפרויקט: כל הסקילז המותקנים יושבים ב-<span class="tag" style="direction:ltr">.claude/skills/&lt;שם&gt;/SKILL.md</span> בתוך הריפו. הנתיב 📍 שמופיע על כל כרטיס הוא נתיב הגישה שנשמר עם כל סימון "מותקן ב…".</div>'
    +'</div></div>';
  SK_CATS.forEach(c=>{ const items=sg[c[0]]; if(!items)return; items.sort((a,b)=>(b[3]===1?1:0)-(a[3]===1?1:0));
    h+='<div class="card sk-sec" data-cat="'+c[0]+'" data-kind="skill"><h3>'+c[2]+' '+c[1]+' <span class="sk-cat-count" data-count>'+items.length+'</span></h3><div class="sk-grid">'+items.map(it=>skItemHtml(it,'skill')).join('')+'</div></div>'; });
  h+='<div class="card sk-sec" data-kind="cmdhead"><h3>⌘ פקודות מוכנות (Slash Commands)</h3><div class="muted" style="font-size:.84rem">'+nCmd+' קיצורים שמריצים עם /שם. אצל כל פקודה מצוין לאילו סקילז היא קשורה.</div></div>';
  SK_CMDG.forEach(c=>{ const items=cg[c[0]]; if(!items)return;
    h+='<div class="card sk-sec" data-cat="'+c[0]+'" data-kind="cmd"><h3>'+c[2]+' '+c[1]+' <span class="sk-cat-count" data-count>'+items.length+'</span></h3><div class="sk-grid">'+items.map(it=>skItemHtml(it,'cmd')).join('')+'</div></div>'; });
  // ---- Skills IL ----
  const bundleChips=ILB.map(b=>'<button class="sk-bundle" onclick="skSelBundle(\''+esc(b[0])+'\')" title="'+esc(b[4]||'')+'">'+b[2]+' '+esc(b[1])+' <span class="n">'+b[3].length+'</span></button>').join('');
  h+='<div class="card sk-sec" data-kind="ilhead"><h3>🇮🇱 Skills IL — סקילז לשוק הישראלי</h3><div class="muted" style="font-size:.84rem;line-height:1.7">'+nIl+' סקילז מארגון skills-il (מיסים, עברית/RTL, סליקה, ממשל, שיווק ועוד). מתחת לשם האנגלי מופיע השם העברי הרשמי, ובריחוף — התיאור המלא.</div>'
    +(bundleChips?'<div class="sk-bundles"><span class="sk-tray-lbl">📦 חבילות מוכנות (לחיצה בוחרת את כל הסקילז שבחבילה):</span>'+bundleChips+'</div>':'')+'</div>';
  ILC.forEach(c=>{ const items=ig[c[0]]; if(!items)return; items.sort((a,b)=>(b[3]===1?1:0)-(a[3]===1?1:0));
    h+='<div class="card sk-sec" data-cat="il-'+c[0]+'" data-kind="il"><h3>'+c[2]+' '+c[1]+' <span class="sk-cat-count" data-count>'+items.length+'</span></h3><div class="sk-grid">'+items.map(it=>skItemHtml(it,'il')).join('')+'</div></div>'; });
  h+='<div class="empty" id="sk-empty" style="display:none">לא נמצאו פריטים תואמים</div>';
  h+='<div style="height:64px"></div><div id="skTray" class="sk-tray"></div>';
  $('view').innerHTML=h; skApply(); skTray();
};
function skView(v,el){ SK_VIEW=v; el.parentNode.querySelectorAll('button').forEach(b=>b.classList.remove('on')); el.classList.add('on'); skApply(); }
function skSetCat(v){ SK_CAT=v; skApply(); }
function skUsageAdd(name,source){
  source=source||'ecc';
  const R=skResolve((source==='skills-il'?'il:':'skill:')+name);
  const opts=SK_SYS.map(s=>'<option value="'+s.id+'">'+esc(s.name)+(s.clientName&&s.clientName!=='—'?' — '+esc(s.clientName):'')+'</option>').join('');
  openModal('<h3>סימון שימוש · '+esc(name)+'</h3>'
    +'<div class="hint" style="margin-bottom:10px;direction:ltr;text-align:left">📍 '+esc(R.ref)+'</div>'
    +'<div class="f"><label>מערכת מהרשימה</label><select id="su_sys"><option value="">— בחר מערכת —</option>'+opts+'</select></div>'
    +'<div class="f"><label>או שם חופשי (אם לא ברשימה)</label><input id="su_name" placeholder="למשל agency-hq / kravmaga-app"></div>'
    +'<div class="modal-actions"><button class="btn primary" onclick="skUsageSave(\''+esc(name)+'\',\''+source+'\')">שמירה</button><button class="btn ghost" onclick="closeModal()">ביטול</button></div>');
}
async function skUsageSave(name,source){
  source=source||'ecc';
  const sysId=val('su_sys'), freeName=val('su_name');
  const sys=SK_SYS.find(s=>s.id===sysId);
  const systemName=freeName||(sys?sys.name:'');
  if(!systemName){ toast('בחר מערכת או הקלד שם','bad'); return; }
  const R=skResolve((source==='skills-il'?'il:':'skill:')+name);
  try{ await apiPost('/skills/usage',{skillName:name,source,sourceRef:R.ref,systemId:sysId||null,systemName}); closeModal(); toast('סומן ✓'); go('skills'); }
  catch(e){ toast('שגיאה','bad'); }
}
async function skUsageDel(id){
  if(!confirm('להסיר את סימון השימוש?'))return;
  try{ await apiDel('/skills/usage/'+id); toast('הוסר'); go('skills'); }
  catch(e){ toast('שגיאה','bad'); }
}
function skStarToggle(el){ SK_STAR=!SK_STAR; el.classList.toggle('teal',SK_STAR); skApply(); }
function skUsedToggle(el){ SK_USED=!SK_USED; el.classList.toggle('teal',SK_USED); skApply(); }
function skApply(){
  const term=($('skq')?.value||'').trim().toLowerCase(); let any=false;
  const filtered=SK_STAR||SK_USED||SK_CAT||term;
  document.querySelectorAll('#view .sk-sec').forEach(sec=>{
    if(sec.dataset.kind==='cmdhead'){ sec.style.display=(SK_VIEW!=='all'&&SK_VIEW!=='cmd')||filtered?'none':''; return; }
    if(sec.dataset.kind==='ilhead'){ sec.style.display=(SK_VIEW!=='all'&&SK_VIEW!=='il')||filtered?'none':''; return; }
    if(SK_CAT && sec.dataset.cat!==SK_CAT){ sec.style.display='none'; return; }
    let shown=0;
    sec.querySelectorAll('.sk-item').forEach(c=>{
      const ok=(!term||c.dataset.s.includes(term))&&(!SK_STAR||c.dataset.star==='1')&&(!SK_USED||c.dataset.inst==='1')&&(SK_VIEW==='all'||c.dataset.type===SK_VIEW);
      c.style.display=ok?'':'none'; if(ok)shown++;
    });
    sec.style.display=shown?'':'none';
    const cnt=sec.querySelector('[data-count]'); if(cnt)cnt.textContent=shown; if(shown)any=true;
  });
  const em=$('sk-empty'); if(em)em.style.display=any?'none':'';
}

// ---------- בחירה מרובה + מגירת בחירה ----------
function skToggleSel(name,type,el){
  const id=type+':'+name;
  if(SK_SEL.has(id)){ SK_SEL.delete(id); el.classList.remove('sel'); }
  else{ SK_SEL.add(id); el.classList.add('sel'); }
  skTray();
}
function skDeSel(id){
  SK_SEL.delete(id);
  const c=document.querySelector('.sk-item[data-id="'+id+'"]'); if(c)c.classList.remove('sel');
  skTray();
}
function skClearSel(){
  SK_SEL.clear();
  document.querySelectorAll('.sk-item.sel').forEach(c=>c.classList.remove('sel'));
  skTray();
}
// בחירת חבילה מוכנה של skills-il — מוסיפה לבחירה את כל הסקילז שבחבילה וקיימים בקטלוג
function skSelBundle(slug){
  const b=IL_BUNDLES().find(x=>x[0]===slug); if(!b)return;
  let n=0;
  b[3].forEach(name=>{ if(!ilItem(name))return; const id='il:'+name; if(SK_SEL.has(id))return; SK_SEL.add(id); n++;
    const c=document.querySelector('.sk-item[data-id="'+id+'"]'); if(c)c.classList.add('sel'); });
  skTray(); toast(n?'נוספו '+n+' סקילז מהחבילה "'+b[1]+'"':'כל הסקילז של החבילה כבר נבחרו');
}
function skSelGroups(){
  const skills=[...SK_SEL].filter(x=>x.startsWith('skill:')).map(x=>x.slice(6)).sort();
  const cmds=[...SK_SEL].filter(x=>x.startsWith('cmd:')).map(x=>x.slice(4)).sort();
  const il=[...SK_SEL].filter(x=>x.startsWith('il:')).map(x=>x.slice(3)).sort();
  return {skills,cmds,il};
}
function skTray(){
  const box=$('skTray'); if(!box)return;
  if(!SK_SEL.size){ box.className='sk-tray'; box.innerHTML=''; return; }
  const {skills,cmds,il}=skSelGroups();
  const grp=(lbl,arr,pre,prefix)=>arr.length?'<div class="sk-tray-grp"><span class="sk-tray-lbl">'+lbl+' ('+arr.length+')</span>'+
    arr.map(n=>'<span class="sk-chip"'+(pre?' style="direction:ltr"':'')+' onclick="skDeSel(\''+prefix+n+'\')">'+(pre||'')+esc(n)+' ✕</span>').join('')+'</div>':'';
  box.className='sk-tray open';
  box.innerHTML='<div class="sk-tray-in"><div class="sk-tray-chips">'+grp('סקילז ECC',skills,'','skill:')+grp('פקודות',cmds,'/','cmd:')+grp('Skills IL 🇮🇱',il,'','il:')+'</div>'
    +'<div class="sk-tray-act"><b>'+SK_SEL.size+' נבחרו</b>'
    +'<label style="display:flex;align-items:center;gap:5px;font-size:12.5px;color:var(--muted);font-weight:600" title="לכלול הוראות התקנה מלאות (כבה בשימוש חוזר באותו סשן)"><input type="checkbox" id="skInstr" '+(SK_WITHINSTR?'checked':'')+' onchange="skSetInstr(this.checked)" style="width:16px;height:16px;accent-color:var(--accent)"> הוראות</label>'
    +'<button class="btn small primary" onclick="skCopySel()">📋 העתק</button>'
    +'<button class="btn small ghost" onclick="skClearSel()">נקה</button></div></div>';
}
// טקסט ההעתקה: הוראות התקנה לכל מקור בנפרד + נתיב גישה לכל פריט
function skBuildCopy(){
  const {skills,cmds,il}=skSelGroups();
  let out=[];
  const nSrc=(skills.length||cmds.length?1:0)+(il.length?1:0);
  if(SK_WITHINSTR && nSrc){
    out.push('התקן לי את הסקילז/פקודות הבאים לפרויקט הנוכחי. '+(nSrc>1?'הם מגיעים משני מקורות שונים — לכל מקור הוראות ונתיב גישה משלו.':'')); out.push('');
  }
  if(skills.length||cmds.length){
    out.push('== מקור: ECC (github.com/affaan-m/ecc) ==');
    if(SK_WITHINSTR){
      out.push('1) שכפל: GIT_LFS_SKIP_SMUDGE=1 git clone --depth 1 https://github.com/affaan-m/ecc /tmp/ecc');
      if(skills.length) out.push('2) לכל סקיל: קרא /tmp/ecc/skills/<שם>/SKILL.md (ודא שאין hooks מפוקפקים), והעתק את התיקייה כולה ל-.claude/skills/<שם>/');
      if(cmds.length) out.push((skills.length?'3':'2')+') לכל פקודה: העתק /tmp/ecc/commands/<שם>.md ל-.claude/commands/<שם>.md');
    }
    if(skills.length){ out.push('סקילז להתקנה:'); skills.forEach(n=>out.push('- '+n+'  ← '+SK_SOURCES.ecc.ref(n,'skill'))); }
    if(cmds.length){ out.push('פקודות להרצה:'); cmds.forEach(n=>out.push('- /'+n+'  ← '+SK_SOURCES.ecc.ref(n,'cmd'))); }
    out.push('');
  }
  if(il.length){
    const repos=[...new Set(il.map(n=>{const it=ilItem(n); return it?it[1]:'?';}))].sort();
    out.push('== מקור: Skills IL (github.com/skills-il · agentskills.co.il) ==');
    if(SK_WITHINSTR){
      out.push('1) שכפל את הריפואים הרלוונטיים (ריפו לכל קטגוריה):');
      repos.forEach(r=>out.push('   GIT_LFS_SKIP_SMUDGE=1 git clone --depth 1 https://github.com/skills-il/'+r+' /tmp/skills-il/'+r));
      out.push('2) לכל סקיל: קרא /tmp/skills-il/<ריפו>/<שם>/SKILL.md (ודא שאין hooks מפוקפקים), והעתק את התיקייה כולה — כולל scripts/ ו-references/ — ל-.claude/skills/<שם>/');
      out.push('   חלופה עם ה-CLI של הארגון: npx skills-il add skills-il/<ריפו> --skill <שם> -a claude-code -y');
    }
    out.push('סקילז להתקנה (שם ← ריפו/נתיב):');
    il.forEach(n=>{ const it=ilItem(n); const repo=it?it[1]:'?'; out.push('- '+n+'  ← '+SK_SOURCES['skills-il'].ref(n,repo)+(it&&it[4]?'  ('+it[4]+')':'')); });
    out.push('');
  }
  if(SK_WITHINSTR && nSrc){
    out.push('לסיום: קמט ודחוף לענף שאני עובד עליו. הסקילז זמינים מיד באותו סשן (הסביבה מזהה אותם בתור הבא).');
  }
  while(out.length&&out[out.length-1]==='')out.pop();
  return { text: out.join('\n'), skills, cmds, il };
}
function skDoCopy(text){
  let ok=false;
  try{ if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(text);ok=true;} }catch(e){}
  if(!ok){ const ta=document.createElement('textarea'); ta.value=text; ta.style.position='fixed'; ta.style.left='-9999px'; document.body.appendChild(ta); ta.select(); try{document.execCommand('copy');}catch(e){} ta.remove(); }
}
function skCopySel(){
  if(!SK_SEL.size) return;
  const {skills,cmds,il}=skBuildCopy();
  const opts=SK_SYS.map(s=>'<option value="'+s.id+'">'+esc(s.name)+(s.clientName&&s.clientName!=='—'?' — '+esc(s.clientName):'')+'</option>').join('');
  const parts=[]; if(skills.length)parts.push(skills.length+' סקילז ECC'); if(cmds.length)parts.push(cmds.length+' פקודות'); if(il.length)parts.push(il.length+' סקילז Skills IL');
  openModal('<h3>📋 העתק + סימון התקנה</h3>'
    +'<div class="hint" style="margin-bottom:10px">'+parts.join(' · ')+' ייכללו בהעתקה — עם נתיב הגישה של כל אחד</div>'
    +'<div class="f"><label>לאיזה פרויקט מדביקים? (לסימון "מותקן ב…")</label><select id="sk_copy_sys"><option value="">— בחר מערכת —</option>'+opts+'</select></div>'
    +'<div class="f"><label>או שם חופשי (אם לא ברשימה)</label><input id="sk_copy_free" placeholder="למשל agency-hq / kravmaga-app"></div>'
    +'<div class="modal-actions"><button class="btn primary" onclick="skCopyConfirm(true)">📋 העתק וסמן</button>'
    +'<button class="btn ghost" onclick="skCopyConfirm(false)">העתק בלבד</button>'
    +'<button class="btn ghost" onclick="closeModal()">ביטול</button></div>');
}
async function skCopyConfirm(mark){
  const {text}=skBuildCopy();
  const n=SK_SEL.size;
  skDoCopy(text);
  if(!mark){ closeModal(); toast('הועתקו '+n+' פריטים'); return; }
  const sysId=val('sk_copy_sys'), freeName=(val('sk_copy_free')||'').trim();
  const sys=SK_SYS.find(s=>s.id===sysId);
  const systemName=freeName||(sys?sys.name:'');
  if(!systemName){ toast('בחר מערכת לסימון, או "העתק בלבד"','bad'); return; }
  let marked=0, skipped=0;
  for(const id of [...SK_SEL]){
    const R=skResolve(id);
    const uses=SK_USAGE[skUseKey(R.source,R.name)]||[];
    const dup=uses.some(u=> sysId ? u.systemId===sysId : (u.systemName===systemName && !u.systemId));
    if(dup){ skipped++; continue; }
    try{ await apiPost('/skills/usage',{skillName:R.name,source:R.source,sourceRef:R.ref,systemId:sysId||null,systemName}); marked++; }catch(e){}
  }
  closeModal();
  toast('הועתקו '+n+' · סומנו '+marked+' ב'+systemName+(skipped?' ('+skipped+' כבר היו)':''));
  go('skills');
}

// ============ הפעלה ============
boot();
</script>
