<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="referrer" content="no-referrer">
<title>טופס | ORT-TECH</title>
<link rel="icon" href="/favicon.ico" sizes="48x48">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" href="/site.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6f4ef;--paper:#fffdf9;--ink:#1d2a3a;--muted:#5d6b7a;--accent:#1741d6;--line:#e2ddd2;--ok:#1f7a4d}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;overflow-x:clip}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.65 Heebo,system-ui,sans-serif;overflow-x:clip}
header{background:var(--paper);border-bottom:1px solid var(--line)}
.wrap{max-width:760px;margin-inline:auto;padding-inline:16px;min-width:0}
header .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:10px}
header img{height:30px;width:auto;display:block}
header small{color:var(--muted);font-size:.85rem}
main{padding-block:26px 90px}
h1{font-size:clamp(1.6rem,6.5vw,2.3rem);line-height:1.2;margin:4px 0 8px;overflow-wrap:anywhere}
.lead{color:var(--muted);margin:0 0 6px}
.progress{height:7px;background:#e4e0d6;border-radius:9px;overflow:hidden;margin:18px 0 6px}
.progress span{display:block;height:100%;width:0;background:var(--accent);transition:width .25s}
.pmeta{font-size:.85rem;color:var(--muted);margin-bottom:6px}
.card{background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:clamp(18px,4vw,28px);margin:18px 0;min-width:0}
.card h2{font-size:1.25rem;line-height:1.3;margin:0 0 14px;overflow-wrap:anywhere}
.field{margin:0 0 22px;min-width:0}
.field:last-child{margin-bottom:0}
label{display:block;font-weight:800;margin-bottom:4px;overflow-wrap:anywhere}
.hint{color:var(--muted);font-size:.88rem;margin:0 0 8px;overflow-wrap:anywhere}
textarea{display:block;width:100%;max-width:100%;min-height:96px;resize:vertical;border:1.5px solid #cfc8b8;border-radius:12px;background:#fff;color:var(--ink);font:inherit;padding:11px 13px}
textarea:focus{outline:3px solid #d5defa;border-color:var(--accent)}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:8px}
.btn{font:800 1rem Heebo,system-ui,sans-serif;border-radius:999px;padding:11px 22px;min-height:48px;cursor:pointer;border:1.5px solid var(--accent);background:var(--accent);color:#fff}
.btn.secondary{background:var(--paper);color:var(--accent)}
.btn:disabled{opacity:.55;cursor:wait}
.status{min-height:1.5em;font-size:.9rem;color:var(--muted);margin:10px 0 0}
.status.ok{color:var(--ok);font-weight:700}
.status.err{color:#a12727}
.notice{text-align:center;padding:40px 16px}
.done{background:#e9f5ee;border:1px solid #a9d3b8;border-radius:14px;padding:14px 16px;margin:16px 0}
@media(max-width:600px){.actions .btn{flex:1 1 100%}}
</style>
</head>
<body>
<header><div class="wrap"><img src="/ort-tech-logo.png" alt="ORT-TECH"><small id="who"></small></div></header>
<main class="wrap" id="app"><div class="notice">טוען את הטופס…</div></main>
<script>
(function(){
  var token=(location.pathname.match(/\/f\/([0-9a-f]{64})/)||[])[1]||new URLSearchParams(location.search).get('t')||'';
  var app=document.getElementById('app');
  var esc=function(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})};
  var timer=null, saving=false, dirty=false;
  function gone(){app.innerHTML='<div class="notice"><h1>הקישור אינו פעיל</h1><p class="lead">ייתכן שהקישור הוחלף או בוטל. אפשר לבקש קישור חדש ממי ששלח לך אותו.</p></div>';}
  if(!token){gone();return;}
  function answers(){var o={};app.querySelectorAll('textarea[data-key]').forEach(function(t){o[t.dataset.key]=t.value});return o}
  function progress(){var all=app.querySelectorAll('textarea[data-key]'),n=0;all.forEach(function(t){if(t.value.trim())n++});
    document.getElementById('bar').style.width=(all.length?Math.round(n/all.length*100):0)+'%';
    document.getElementById('pmeta').textContent=n+' מתוך '+all.length+' שאלות נענו';}
  function setStatus(txt,cls){var s=document.getElementById('status');s.className='status'+(cls?' '+cls:'');s.textContent=txt}
  function save(final){
    clearTimeout(timer);
    if(saving){dirty=true;return Promise.resolve();}
    saving=true;dirty=false;
    var b=document.getElementById(final?'submit':'save');if(b)b.disabled=true;
    if(!final)setStatus('שומר טיוטה…');
    return fetch('/api/form/'+token,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({answers:answers(),final:!!final})})
      .then(function(r){if(r.status===404){gone();throw 0}if(!r.ok)throw Error('השמירה נכשלה. בדוק את החיבור ונסה שוב.');return r.json()})
      .then(function(){
        if(final){setStatus('התשובות נשלחו. תודה!','ok');var d=document.getElementById('donebox');d.hidden=false;d.scrollIntoView({behavior:'smooth',block:'center'});}
        else setStatus('הטיוטה נשמרה ✓');
      })
      .catch(function(e){if(e)setStatus(e.message||'השמירה נכשלה','err')})
      .then(function(){saving=false;if(b)b.disabled=false;if(dirty)timer=setTimeout(function(){save(false)},800)});
  }
  fetch('/api/form/'+token).then(function(r){if(!r.ok)throw 0;return r.json()}).then(function(d){
    document.title=d.title+' | ORT-TECH';
    if(d.clientName)document.getElementById('who').textContent=d.clientName;
    var html='<h1>'+esc(d.title)+'</h1><p class="lead">אפשר לענות בקצרה ובמילים שלך. התשובות נשמרות אוטומטית כטיוטה — אפשר לעצור ולחזור לאותו קישור מאוחר יותר.</p>'+
      '<div class="progress" aria-hidden="true"><span id="bar"></span></div><div class="pmeta" id="pmeta"></div>'+
      '<div class="done" id="donebox"'+(d.completed?'':' hidden')+'>✅ התשובות נשלחו. אפשר עדיין לעדכן ולשלוח שוב.</div>';
    d.sections.forEach(function(s){
      html+='<section class="card">'+(s.title?'<h2>'+esc(s.title)+'</h2>':'');
      s.items.forEach(function(it){
        var id='q_'+it.key;
        html+='<div class="field"><label for="'+id+'">'+esc(it.label)+'</label>'+(it.hint?'<p class="hint">'+esc(it.hint)+'</p>':'')+
          '<textarea id="'+id+'" data-key="'+esc(it.key)+'" maxlength="4000">'+esc(d.answers[it.key]||'')+'</textarea></div>';
      });
      html+='</section>';
    });
    html+='<div class="actions"><button class="btn secondary" type="button" id="save">שמירת טיוטה</button><button class="btn" type="button" id="submit">שליחת התשובות</button></div><p class="status" id="status" role="status" aria-live="polite"></p>';
    app.innerHTML=html;
    progress();
    app.addEventListener('input',function(){progress();setStatus('');clearTimeout(timer);timer=setTimeout(function(){save(false)},1200)});
    document.getElementById('save').onclick=function(){save(false)};
    document.getElementById('submit').onclick=function(){save(true)};
    window.addEventListener('beforeunload',function(e){if(timer){save(false)}});
  }).catch(gone);
})();
</script>
</body>
</html>
