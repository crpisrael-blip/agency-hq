<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agency HQ — מערכת עיצוב</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700;800;900&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0f1424;--bg-2:#171d33;--card:#1b2340;--card-2:#212a4d;--line:#2c3760;
    --txt:#eaf0ff;--muted:#93a0c8;--accent:#6c5ce7;--accent-2:#00d1b2;--amber:#f6b73c;
    --green:#22c55e;--red:#ef4444;--blue:#3b82f6;--purple:#a855f7;
    --shadow-sm:0 2px 10px rgba(0,0,0,.22);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Heebo',system-ui,sans-serif;background:var(--bg);color:var(--txt);line-height:1.5;padding:32px 20px 60px;-webkit-font-smoothing:antialiased}
  .wrap{max-width:1000px;margin:0 auto}
  h1{font-size:2rem;font-weight:900;margin-bottom:2px}
  .lead{color:var(--muted);margin-bottom:28px}
  h2{font-size:1.1rem;font-weight:800;margin:30px 0 12px;padding-bottom:8px;border-bottom:1px solid var(--line)}
  .swatches{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
  .sw{border:1px solid var(--line);border-radius:11px;overflow:hidden;background:var(--card)}
  .sw .chip{height:56px}
  .sw .meta{padding:8px 10px;font-size:.78rem}
  .sw .meta b{display:block}
  .sw .meta span{color:var(--muted);font-variant-numeric:tabular-nums;direction:ltr}
  .type-row{display:flex;align-items:baseline;gap:14px;padding:7px 0;border-bottom:1px dashed var(--line)}
  .type-row .tag{font-size:.72rem;color:var(--muted);direction:ltr;min-width:120px;font-variant-numeric:tabular-nums}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  .btn{background:var(--card);border:1.5px solid var(--line);color:var(--txt);font-weight:700;padding:8px 16px;border-radius:999px;font-size:.88rem;font-family:inherit;cursor:pointer;min-height:40px;display:inline-flex;align-items:center;gap:6px;transition:transform .14s,border-color .14s}
  .btn:hover{border-color:var(--accent)}
  .btn:active{transform:scale(.96)}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
  .btn.teal{background:var(--accent-2);border-color:var(--accent-2);color:#04201c}
  .btn.ghost{background:transparent}
  .btn.danger{color:var(--red);border-color:transparent}
  .pill{padding:2px 11px;border-radius:999px;font-size:.74rem;font-weight:700;border:1px solid;white-space:nowrap}
  .p-blue{background:rgba(59,130,246,.14);color:#8fbcff;border-color:rgba(59,130,246,.4)}
  .p-green{background:rgba(34,197,94,.14);color:#7ee2a8;border-color:rgba(34,197,94,.4)}
  .p-amber{background:rgba(246,183,60,.14);color:#f7cd78;border-color:rgba(246,183,60,.4)}
  .p-red{background:rgba(239,68,68,.14);color:#f6a1a1;border-color:rgba(239,68,68,.4)}
  .p-purple{background:rgba(168,85,247,.14);color:#d3aef7;border-color:rgba(168,85,247,.4)}
  .p-teal{background:rgba(0,209,178,.14);color:#6ee7d3;border-color:rgba(0,209,178,.4)}
  .p-gray{background:rgba(147,160,200,.12);color:var(--muted);border-color:var(--line)}
  input{background:var(--bg-2);border:1px solid var(--line);color:var(--txt);border-radius:10px;padding:9px 12px;font-family:inherit;font-size:.92rem;width:100%;max-width:280px;transition:border-color .14s,box-shadow .14s}
  input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(108,92,231,.22)}
  .cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:15px 17px;box-shadow:var(--shadow-sm)}
  .kpi b{font-size:1.5rem;font-weight:900;display:block;font-variant-numeric:tabular-nums}
  .kpi.accent b{color:var(--accent-2)}
  .kpi small{color:var(--muted);font-size:.78rem}
  .note{color:var(--muted);font-size:.8rem;margin-top:8px}
</style>
</head>
<body>
<div class="wrap">
  <h1>מערכת העיצוב — Agency HQ</h1>
  <div class="lead">תצוגה חיה של הטוקנים (מבט כהה יחיד · Heebo). הופק ע״י סקיל design-system.</div>

  <h2>פלטה</h2>
  <div class="swatches" id="palette"></div>

  <h2>סקאלת טיפוגרפיה (מוצעת)</h2>
  <div id="type"></div>

  <h2>כפתורים</h2>
  <div class="row">
    <button class="btn primary">ראשי</button>
    <button class="btn teal">טורקיז</button>
    <button class="btn">רגיל</button>
    <button class="btn ghost">שקוף</button>
    <button class="btn danger">מחיקה</button>
  </div>

  <h2>Pills סמנטיים</h2>
  <div class="row">
    <span class="pill p-green">פעיל</span><span class="pill p-amber">בהמתנה</span>
    <span class="pill p-red">סיכון</span><span class="pill p-blue">בבנייה</span>
    <span class="pill p-teal">חי</span><span class="pill p-purple">עיצוב</span>
    <span class="pill p-gray">הוקפא</span>
  </div>

  <h2>שדה קלט</h2>
  <input placeholder="לחצו כדי לראות טבעת פוקוס…">

  <h2>כרטיסים</h2>
  <div class="cards">
    <div class="card kpi accent"><b>₪18,500</b><small>הכנסה חוזרת חודשית</small></div>
    <div class="card kpi"><b>6</b><small>לקוחות פעילים</small></div>
    <div class="card"><b style="font-weight:800">כרטיס תוכן</b><div class="note">משטח בסיסי עם צל עדין ורדיוס 15px.</div></div>
  </div>
</div>

<script>
  const PAL=[
    ['--bg','#0f1424','רקע'],['--bg-2','#171d33','רקע 2'],['--card','#1b2340','כרטיס'],['--card-2','#212a4d','כרטיס 2'],
    ['--line','#2c3760','קו'],['--txt','#eaf0ff','טקסט'],['--muted','#93a0c8','טקסט מעומעם'],
    ['--accent','#6c5ce7','אקסנט'],['--accent-2','#00d1b2','אקסנט 2 (כסף)'],
    ['--green','#22c55e','ירוק'],['--amber','#f6b73c','כתום'],['--red','#ef4444','אדום'],['--blue','#3b82f6','כחול'],['--purple','#a855f7','סגול']
  ];
  document.getElementById('palette').innerHTML=PAL.map(p=>
    '<div class="sw"><div class="chip" style="background:'+p[1]+'"></div><div class="meta"><b>'+p[2]+'</b><span>'+p[0]+' · '+p[1]+'</span></div></div>').join('');
  const TYPE=[['3xl','2.6'],['2xl','1.9'],['xl','1.5'],['lg','1.3'],['md','1.05'],['base','0.92'],['sm','0.84'],['xs','0.76'],['2xs','0.7']];
  document.getElementById('type').innerHTML=TYPE.map(t=>
    '<div class="type-row"><span class="tag">'+t[0]+' · '+t[1]+'rem</span><span style="font-size:'+t[1]+'rem;font-weight:'+(parseFloat(t[1])>=1.3?800:500)+'">שועל חום קפץ מעל הכלב העצלן</span></div>').join('');
</script>
</body>
</html>
