# Cloudflare Pages + D1 configuration
# ---------------------------------------------------------------
# name: שם פרויקט ה-Pages (אפשר לשנות)
name = "agency-hq"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

# תיקיית הפלט הסטטי שמוגשת ע"י Pages (האתר). ה-API יושב ב-/functions
pages_build_output_dir = "public"

# --- בסיס הנתונים D1 ---
# database_id יוחלף בערך האמיתי אחרי שתיצור את מסד הנתונים ב-Cloudflare:
#   npx wrangler d1 create agency-hq-db
[[d1_databases]]
binding = "DB"
database_name = "agency-hq-db"
database_id = "81a73754-cd5a-498b-a4d2-79c70d29fa02"
migrations_dir = "migrations"

# --- אחסון קבצים R2 (קבלות להוצאות) ---
# bucket פרטי — הגישה לקבצים עוברת דרך ה-API בלבד (מוגן בטוקן מנהל).
# מושבת עד שמפעילים R2 בחשבון (Dashboard → R2 → Enable) ויוצרים את ה-bucket:
#   npx wrangler r2 bucket create agency-hq-receipts
# עד אז הקוד מתפקד בחן: העלאת/צפיית קבלה מחזירה 503 (storage_unavailable),
# ושאר מסך הכספים עובד רגיל. לאחר ההפעלה — הסירו את ההערה מהבלוק הבא ופרסו מחדש.
# [[r2_buckets]]
# binding = "RECEIPTS"
# bucket_name = "agency-hq-receipts"
