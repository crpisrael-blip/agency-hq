name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  # מזהה החשבון אינו סוד. הטוקן מגיע מ-secret בשם CLOUDFLARE_API_TOKEN.
  CLOUDFLARE_ACCOUNT_ID: dc5530c5ab99ef923cee4d53e607cdef

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # שער ראשון: בלי טוקן אין מיגרציות ואין פריסה — ואסור שזה ייראה כהצלחה.
      # קודם הצינור "דילג" בשקט וסיים ירוק, כך שכל מיזוג נראה כאילו עלה לאוויר
      # בזמן ששום דבר לא נפרס. עדיף להיכשל רועש מלשקר בירוק.
      - name: Verify deploy credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error title=חסר CLOUDFLARE_API_TOKEN::הפריסה לא בוצעה. הוסף secret בשם CLOUDFLARE_API_TOKEN תחת Settings → Secrets and variables → Actions, עם הרשאות D1:Edit ו-Cloudflare Pages:Edit, ואז הרץ מחדש את ה-workflow."
            exit 1
          fi
          echo "נמצא טוקן — ממשיכים למיגרציות ולפריסה."

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      # המיגרציות תמיד לפני הפריסה: קוד חדש מול סכמה ישנה נופל על עמודות חסרות.
      - name: Apply D1 migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx wrangler d1 migrations apply agency-hq-db --remote

      - name: Deploy to Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx wrangler pages deploy public --project-name agency-hq --branch main

      # חיבור קבוע ובטוח להרצות עתידיות: אם הדומיין כבר קיים, לא משתנה דבר.
      - name: Ensure presentation custom domain
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          PRESENTATION_DOMAIN: deck.ort-tech.co.il
        run: |
          DOMAINS_URL="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/agency-hq/domains"
          CURRENT=$(curl --fail-with-body --silent --show-error             -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN"             "$DOMAINS_URL")

          if echo "$CURRENT" | jq -e --arg domain "$PRESENTATION_DOMAIN" '.result[]? | select(.name == $domain)' >/dev/null; then
            echo "$PRESENTATION_DOMAIN already attached"
            exit 0
          fi

          CREATED=$(curl --fail-with-body --silent --show-error             -X POST             -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN"             -H "Content-Type: application/json"             --data "{\"name\":\"$PRESENTATION_DOMAIN\"}"             "$DOMAINS_URL")

          echo "$CREATED" | jq -e '.success == true' >/dev/null
          echo "$PRESENTATION_DOMAIN attached"
