name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  # מזהה החשבון אינו סוד. הטוקן מגיע מ-secret בשם CLOUDFLARE_API_TOKEN.
  CLOUDFLARE_ACCOUNT_ID: dc5530c5ab99ef923cee4d53e607cdef

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Apply D1 migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "אין CLOUDFLARE_API_TOKEN — מדלג על מיגרציות (הוסף secret כדי להפעיל פריסה אוטומטית)."
            exit 0
          fi
          npx wrangler d1 migrations apply agency-hq-db --remote

      - name: Deploy to Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "אין CLOUDFLARE_API_TOKEN — מדלג על פריסה."
            exit 0
          fi
          npx wrangler pages deploy public --project-name agency-hq --branch main
