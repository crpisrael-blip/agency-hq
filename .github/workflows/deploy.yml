name: Deploy to Cloudflare Pages

on:
  push:
    # פריסה רצה גם מענף ברירת המחדל (שאליו ממוזגות כל ה-PRs) וגם מ-main.
    # כך מיזוג לענף העבודה עולה לאוויר אוטומטית — בלי צורך בקידום ידני ל-main.
    branches: [main, claude/business-management-system-s59kpk]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  # מזהה החשבון אינו סוד. הטוקן מגיע מ-secret בשם CLOUDFLARE_API_TOKEN.
  CLOUDFLARE_ACCOUNT_ID: dc5530c5ab99ef923cee4d53e607cdef

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # שער ראשון: בלי טוקן אין מיגרציות ואין פריסה — ואסור שזה ייראה כהצלחה.
      # קודם הצינור "דילג" בשקט וסיים ירוק, כך שכל מיזוג נראה כאילו עלה לאוויר
      # בזמן ששום דבר לא נפרס. עדיף להיכשל רועש מלשקר בירוק.
      - name: Verify deploy credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error title=חסר CLOUDFLARE_API_TOKEN::הפריסה לא בוצעה. הוסף secret בשם CLOUDFLARE_API_TOKEN תחת Settings → Secrets and variables → Actions, עם הרשאות D1:Edit ו-Cloudflare Pages:Edit, ואז הרץ מחדש את ה-workflow."
            exit 1
          fi
          echo "נמצא טוקן — ממשיכים למיגרציות ולפריסה."

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      # המיגרציות תמיד לפני הפריסה: קוד חדש מול סכמה ישנה נופל על עמודות חסרות.
      # כישלון כאן עוצר את הצינור ומונע פריסה של קוד שאין לו סכמה תואמת.
      - name: Apply D1 migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx wrangler d1 migrations apply agency-hq-db --remote

      - name: Deploy to Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx wrangler pages deploy public --project-name agency-hq --branch main
